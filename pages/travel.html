<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>旅行 — 黄梓健</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; overflow:hidden; }
  body { background: radial-gradient(120% 100% at 50% 20%, #f7f4ed 0%, #efece3 60%, #e4e2d6 100%); font-family:"Hiragino Kaku Gothic ProN", sans-serif; color:#4a4a43; }
  #stage { position:fixed; inset:0; }

  .back { position:fixed; top:clamp(18px, 3.5vh, 40px); left:clamp(18px, 2.5vw, 40px); z-index:20;
    font:700 clamp(12px, 1vw, 15px)/1 "Hiragino Kaku Gothic ProN", sans-serif; letter-spacing:.12em;
    color:#6f6d62; text-decoration:none; border:1px solid rgba(96,102,88,.3); border-radius:999px;
    padding:.9em 1.5em; transition: all .25s ease; background:rgba(255,255,255,.4); backdrop-filter:blur(6px); }
  .back:hover { border-color:#7f8a6b; color:#4a4a43; box-shadow:0 0 20px rgba(96,102,88,.25); }

  .head { position:fixed; left:clamp(18px, 2.5vw, 40px); top:clamp(76px, 11vh, 118px); z-index:12;
    opacity:0; transform:translateY(10px); transition:.9s cubic-bezier(.22,.9,.3,1); pointer-events:none; }
  .head.on { opacity:1; transform:none; }
  .eyebrow { font:600 clamp(10px, .9vw, 13px)/1 "Helvetica Neue", Arial, sans-serif;
    letter-spacing:.4em; color:#7f8a6b; margin-bottom:.9em; }
  h1 { font:800 clamp(24px, 3vw, 44px)/1.2 "Hiragino Kaku Gothic ProN", sans-serif; }

  /* 地球の上のピン: 日本の地図へ降りる入口。触れるものなので桃色の丸いボタンにする */
  .pin { position:fixed; z-index:11; transform:translate(-50%,-100%); cursor:pointer;
    opacity:0; transition: opacity .6s ease; text-align:center; }
  .pin.on { opacity:1; }
  .pin b { display:inline-block; font:800 clamp(12px, 1.05vw, 16px)/1 "Hiragino Kaku Gothic ProN", sans-serif;
    color:#fff; letter-spacing:.1em; padding:.8em 1.3em; border-radius:999px; background:#c48d7e;
    box-shadow:0 6px 18px rgba(196,141,126,.35), 0 0 0 4px rgba(255,255,255,.75);
    animation: pinpulse 2.4s ease-in-out infinite; transition: background .25s ease, transform .25s ease; }
  .pin s { display:block; text-decoration:none; width:1px; height:clamp(18px, 2.6vh, 34px);
    margin:.4em auto 0; background:linear-gradient(180deg, #c48d7e, transparent); }
  .pin:hover b { background:#b57b6c; transform:translateY(-2px); }
  @keyframes pinpulse {
    0%, 100% { box-shadow:0 6px 18px rgba(196,141,126,.35), 0 0 0 4px rgba(255,255,255,.75); }
    50% { box-shadow:0 6px 22px rgba(196,141,126,.5), 0 0 0 10px rgba(196,141,126,.16); } }
  .jpgo { margin-top:1em; width:100%; padding:.85em 0; border-radius:999px; cursor:pointer; border:none;
    background:#c48d7e; color:#fff; font:800 clamp(11px, .95vw, 14px)/1 "Hiragino Kaku Gothic ProN", sans-serif;
    letter-spacing:.14em; box-shadow:0 6px 16px rgba(196,141,126,.28); transition: background .25s ease; }
  .jpgo:hover { background:#b57b6c; }
  /* 共有(桃色の線のボタン)と、もらった地図の一覧 */
  .share { margin-top:.6em; width:100%; padding:.75em 0; border-radius:999px; cursor:pointer;
    border:1px solid #c48d7e; background:transparent; color:#c48d7e;
    font:800 clamp(11px, .95vw, 14px)/1 "Hiragino Kaku Gothic ProN", sans-serif; letter-spacing:.14em;
    transition: all .25s ease; }
  .share:hover { background:rgba(196,141,126,.12); }
  .recv { margin-top:1em; padding-top:.9em; border-top:1px solid rgba(96,102,88,.16); }
  .recv em { font-style:normal; display:block; font:600 clamp(9px, .8vw, 12px)/1 "Hiragino Kaku Gothic ProN", sans-serif;
    letter-spacing:.2em; color:#a5a398; }
  .recv ol { list-style:none; margin:.55em 0 0; padding:0; max-height:9.6em; overflow:auto; }
  .recv li button { width:100%; display:flex; gap:.6em; align-items:baseline; background:none; border:0; padding:.34em 0;
    cursor:pointer; font:600 clamp(11px, .9vw, 13px)/1.3 "Hiragino Kaku Gothic ProN", sans-serif; color:#4a4a43; text-align:left; }
  .recv .rk { width:1.5em; flex:none; color:#a5a398; font:700 .85em/1.3 "Helvetica Neue", Arial, sans-serif; }
  .recv b { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recv i { font-style:normal; color:#7a786e; font-size:.9em; flex:none; }
  .recv li.me button { cursor:default; } .recv li.me b { color:#7f8a6b; }
  .recv li:not(.me) button:hover b { color:#c48d7e; }
  .recv li.now b { color:#c48d7e; }
  /* だれかの地図を見ているとき: 塗れない・消せない・共有しない */
  body.viewing .reset, body.viewing .share { display:none; }
  .back-own { display:none; margin-top:.6em; width:100%; padding:.75em 0; border-radius:999px; cursor:pointer;
    border:1px solid rgba(96,102,88,.28); background:transparent; color:#6f6d62;
    font:700 clamp(10px, .85vw, 12px)/1 "Hiragino Kaku Gothic ProN", sans-serif; letter-spacing:.14em; }
  body.viewing .back-own { display:block; }
  .back-own:hover { border-color:#7f8a6b; color:#4a4a43; }
  .who { margin-top:.5em; font:700 clamp(12px, 1.05vw, 15px)/1.4 "Hiragino Kaku Gothic ProN", sans-serif;
    color:#c48d7e; letter-spacing:.1em; }
  /* 共有の小窓 */
  .share-box { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
    background:rgba(74,74,67,.22); backdrop-filter:blur(4px); }
  .share-box.on { display:flex; }
  .sb-card { width:min(420px, 92vw); background:rgba(255,255,255,.96); border:1px solid rgba(96,102,88,.2);
    border-radius:18px; padding:clamp(18px, 2vw, 26px); box-shadow:0 20px 60px rgba(60,60,50,.18); }
  .sb-card em { font-style:normal; display:block; font:600 clamp(9px, .8vw, 12px)/1 "Hiragino Kaku Gothic ProN", sans-serif;
    letter-spacing:.2em; color:#a5a398; margin-bottom:.7em; }
  .sb-card input { width:100%; box-sizing:border-box; padding:.75em .9em; border-radius:12px;
    border:1px solid rgba(96,102,88,.3); background:#fbfaf6; color:#4a4a43;
    font:600 clamp(14px, 1.1vw, 17px)/1.3 "Hiragino Kaku Gothic ProN", sans-serif; outline:none; }
  .sb-card input:focus { border-color:#c48d7e; }
  .sb-card input[readonly] { font:500 12px/1.4 "Helvetica Neue", Arial, sans-serif; color:#6f6d62; }
  .sb-card .jpgo { margin-top:.8em; }
  .sb-out { margin-top:1.1em; padding-top:1em; border-top:1px solid rgba(96,102,88,.16); }
  .sb-out p { margin:.7em 0 0; font:600 clamp(11px, .9vw, 13px)/1.5 "Hiragino Kaku Gothic ProN", sans-serif; color:#7f8a6b; min-height:1.5em; }

  /* 日本地図 */
  .jp { position:fixed; inset:0; z-index:14; opacity:0; pointer-events:none;
    transition: opacity .9s ease; background:radial-gradient(120% 100% at 50% 40%, #eef0e8 0%, #e6e4da 60%, #f6f3ec 100%); }
  .jp.on { opacity:1; pointer-events:auto; }
  path.pref { opacity:0; transform-origin:center; }
  .jp.on path.pref { animation: landIn .7s cubic-bezier(.22,.9,.3,1) forwards; }
  @keyframes landIn { from { opacity:0; transform:translateY(14px) scale(.985); } to { opacity:1; transform:none; } }
  #jpsvg text { opacity:0; }
  .jp.on #jpsvg text { animation: fadeIn .5s ease forwards; animation-delay:.75s; }
  @keyframes fadeIn { to { opacity:1; } }
  .jp svg { position:absolute; inset:0; width:100%; height:100%; }
  .pref { cursor:pointer; }
  .route { stroke:#7f8a6b; stroke-width:1.5; fill:none; stroke-linecap:round;
    filter:drop-shadow(0 0 5px rgba(96,102,88,.8)); transition: opacity .4s ease; }
  path.pref { cursor:pointer; fill:rgba(127,138,107,.13); stroke:rgba(96,102,88,.30);
    stroke-width:.7; stroke-linejoin:round; transition: fill .4s ease, stroke .3s ease; }
  path.pref.mine  { fill:rgba(196,141,126,.38); stroke:rgba(196,141,126,.85); }
  path.pref.yours { fill:rgba(96,102,88,.45); stroke:rgba(127,138,107,.95); }
  path.pref.both  { fill:rgba(157,179,191,.52); stroke:#c48d7e; stroke-width:1.3; }
  path.pref.hov   { fill:rgba(127,138,107,.65); stroke:#fff; stroke-width:1.3; }
  #jpsvg text { font:600 9.5px/1 "Hiragino Kaku Gothic ProN", sans-serif; fill:#a5a398;
    text-anchor:middle; cursor:pointer; transition: fill .3s ease;
    paint-order:stroke; stroke:rgba(255,255,255,.85); stroke-width:2.6px; }
  #jpsvg text.lit { fill:#4a4a43; }
  #jpsvg text.hov { fill:#fff; }

  .jp-ui { position:fixed; z-index:16; left:clamp(18px, 2.5vw, 40px); top:clamp(76px, 11vh, 118px);
    opacity:0; transition:.8s cubic-bezier(.22,.9,.3,1) .3s; transform:translateY(10px); }
  .jp.on ~ .jp-ui { opacity:1; transform:none; }
  .jp-ui .eyebrow { margin-bottom:.7em; }
  .jp-ui h2 { font:800 clamp(20px, 2.4vw, 34px)/1.25 "Hiragino Kaku Gothic ProN", sans-serif; }
  .jp-ui p { margin-top:.9em; font:500 clamp(11px, .95vw, 14px)/1.85
    "Hiragino Kaku Gothic ProN", sans-serif; color:#7a786e; max-width:20em; }

  .score { position:fixed; z-index:16; right:clamp(16px, 2.6vw, 46px); top:50%;
    transform:translateY(-50%) translateX(36px); width:clamp(232px, 20vw, 300px);
    background:rgba(255,255,255,.72); border:1px solid rgba(96,102,88,.22); border-radius:18px;
    padding:clamp(16px, 1.5vw, 24px); backdrop-filter:blur(12px);
    opacity:0; pointer-events:none; transition:.8s cubic-bezier(.22,.9,.3,1) .45s; }
  .jp.on ~ .score { opacity:1; transform:translateY(-50%); pointer-events:auto; }
  .score-row { padding:.85em 0; border-bottom:1px solid rgba(96,102,88,.14); }
  .score-row:last-of-type { border-bottom:none; }
  .score-row em { font-style:normal; display:block; font:600 clamp(9px, .8vw, 12px)/1
    "Hiragino Kaku Gothic ProN", sans-serif; letter-spacing:.2em; color:#a5a398; margin-bottom:.7em; }
  .score-row .n { display:flex; align-items:baseline; gap:.3em; }
  .score-row .n b { font:800 clamp(26px, 2.5vw, 40px)/1 "Helvetica Neue", sans-serif; }
  .score-row .n span { font:700 clamp(11px, .95vw, 14px)/1 "Helvetica Neue", sans-serif; color:#a5a398; }
  .score-row.gold .n b { color:#c48d7e; }
  .score-row.you .n b { color:#7f8a6b; }
  .bar { height:5px; border-radius:3px; background:rgba(96,102,88,.14); overflow:hidden; margin-top:.7em; }
  .bar i { display:block; height:100%; width:0; border-radius:3px; transition: width .5s cubic-bezier(.22,.9,.3,1); }
  .score-row.gold .bar i { background:linear-gradient(90deg, #e3bfb3, #c48d7e); }
  .score-row.you .bar i { background:linear-gradient(90deg, #cfd4c3, #7f8a6b); }
  .title-row { margin-top:1.1em; padding-top:1.1em; border-top:1px solid rgba(96,102,88,.16); }
  .title-row em { font-style:normal; display:block; font:600 clamp(9px, .8vw, 12px)/1
    "Hiragino Kaku Gothic ProN", sans-serif; letter-spacing:.2em; color:#a5a398; margin-bottom:.55em; }
  .title-row b { font:800 clamp(15px, 1.4vw, 21px)/1.3 "Hiragino Kaku Gothic ProN", sans-serif;
    color:#4a4a43; transition: color .4s ease; }
  .title-row b.done { color:#c48d7e; text-shadow:0 0 20px rgba(196,141,126,.55); }
  .regions { display:flex; flex-wrap:wrap; gap:.34em; margin-top:1em; }
  .regions span { font:700 clamp(8px, .72vw, 11px)/1 "Hiragino Kaku Gothic ProN", sans-serif;
    padding:.5em .68em; border-radius:999px; letter-spacing:.06em;
    border:1px solid rgba(96,102,88,.2); color:#a5a398; transition: all .4s ease; }
  .regions span.part { color:#6f6d62; border-color:rgba(96,102,88,.45); }
  .regions span.full { color:#ffffff; border-color:transparent;
    background:linear-gradient(135deg, #c48d7e, #c48d7e); box-shadow:0 0 14px rgba(196,141,126,.4); }
  .regions span.pop { animation: pop .6s cubic-bezier(.2,1.6,.4,1); }
  @keyframes pop { 0% { transform:scale(1); } 40% { transform:scale(1.38); } 100% { transform:scale(1); } }
  #confetti { position:fixed; inset:0; z-index:19; pointer-events:none; }
  .verdict { margin-top:1.1em; padding-top:1.1em; border-top:1px solid rgba(96,102,88,.16);
    font:700 clamp(11px, 1vw, 15px)/1.7 "Hiragino Kaku Gothic ProN", sans-serif; color:#4a4a43; min-height:3.4em; }
  .reset { margin-top:1em; width:100%; padding:.7em 0; border-radius:999px; cursor:pointer;
    border:1px solid rgba(96,102,88,.28); background:transparent; color:#a5a398;
    font:700 clamp(10px, .85vw, 12px)/1 "Hiragino Kaku Gothic ProN", sans-serif; letter-spacing:.14em;
    transition: all .25s ease; }
  .reset:hover { border-color:#7f8a6b; color:#4a4a43; }

  .globe-btn { position:fixed; z-index:16; left:clamp(18px, 2.5vw, 40px); bottom:clamp(20px, 4vh, 44px);
    padding:.85em 1.6em; border-radius:999px; cursor:pointer; opacity:0; pointer-events:none;
    border:1px solid rgba(96,102,88,.3); background:rgba(255,255,255,.5); color:#6f6d62;
    font:700 clamp(11px, .95vw, 14px)/1 "Hiragino Kaku Gothic ProN", sans-serif; letter-spacing:.12em;
    backdrop-filter:blur(6px); transition:.6s ease .5s; }
  .jp.on ~ .globe-btn { opacity:1; pointer-events:auto; }
  .globe-btn:hover { border-color:#7f8a6b; color:#4a4a43; }

  .wscore { position:fixed; z-index:12; right:clamp(16px, 2.6vw, 46px); top:50%;
    transform:translateY(-50%); width:clamp(214px, 18vw, 272px);
    background:rgba(255,255,255,.66); border:1px solid rgba(96,102,88,.2); border-radius:18px;
    padding:clamp(15px, 1.4vw, 22px); backdrop-filter:blur(12px);
    opacity:0; transition: opacity .8s ease .8s; }
  .wscore.on { opacity:1; }
  .flash { position:fixed; inset:0; z-index:15; background:#fff; opacity:0; pointer-events:none; }
  .tip { position:fixed; z-index:18; pointer-events:none; opacity:0; transform:translate(-50%,-140%);
    padding:.6em .95em; border-radius:11px; white-space:nowrap; transition: opacity .18s ease;
    background:rgba(255,255,255,.92); border:1px solid rgba(96,102,88,.3); backdrop-filter:blur(8px);
    font:700 clamp(11px, .95vw, 14px)/1.5 "Hiragino Kaku Gothic ProN", sans-serif; color:#4a4a43; }
  .tip.on { opacity:1; }
  .tip em { font-style:normal; display:block; font-weight:600; font-size:.8em; margin-top:.25em; }
  .tip em.g { color:#c48d7e; } .tip em.p { color:#7f8a6b; } .tip em.n { color:#a5a398; }

  /* 縦画面: 地図は上半分、成績は下のシートに */
  @media (max-width: 860px), (max-aspect-ratio: 1/1) {
    .jp svg { top:8%; height:52%; }
    .score { right:50%; left:auto; top:auto; bottom:0; transform:translateX(50%) translateY(26px);
      width:100%; max-width:none; border-radius:20px 20px 0 0; border-bottom:none;
      padding:16px 18px calc(16px + env(safe-area-inset-bottom)); }
    .jp.on ~ .score { transform:translateX(50%); }
    .score-row { padding:.5em 0; }
    .score-row .n b { font-size:26px; }
    .verdict { margin-top:.7em; padding-top:.7em; min-height:0; }
    .title-row { margin-top:.7em; padding-top:.7em; }
    .regions { margin-top:.6em; }
    .reset { margin-top:.7em; }
    .jp-ui p { display:none; }
    .jp-ui { top:clamp(60px, 8vh, 90px); }
    .jp-ui h2 { font-size:19px; }
    .globe-btn { bottom:auto; top:clamp(16px, 3vh, 30px); left:auto; right:clamp(16px, 4vw, 30px);
      padding:.7em 1.1em; }
    /* 縦画面では下のシートが大きくなりすぎて地球を隠す。行間と文字を詰める */
    .wscore { right:50%; top:auto; bottom:clamp(10px, 2vh, 20px); transform:translateX(50%);
      width:min(400px, 94vw); padding:12px 14px; }
    .wscore .score-row { padding:.42em 0; }
    .wscore .score-row .n b { font-size:23px; }
    .wscore .title-row { margin-top:.55em; padding-top:.55em; }
    .wscore .title-row b { font-size:15px; }
    .wscore .regions { margin-top:.5em; gap:.26em; }
    .wscore .regions span { padding:.3em .5em; font-size:9px; }
    .wscore .verdict { margin-top:.55em; padding-top:.55em; font-size:11px; min-height:0; line-height:1.5; }
    .wscore .reset { margin-top:.6em; padding:.55em 0; }
    .wscore .jpgo { margin-top:.6em; padding:.62em 0; }
    .wscore .share, .wscore .back-own { margin-top:.45em; padding:.55em 0; }
    .wscore .recv { margin-top:.6em; padding-top:.5em; } .wscore .recv ol { max-height:5.2em; }
    .back { padding:.75em 1.1em; }
  }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<a class="back" href="../index.html?reveal=1">← ホームへ戻る</a>

<div class="head" id="head">
  <h1>旅行</h1>
  <p class="who" id="who" hidden></p>
</div>

<div class="jp" id="jp"><svg id="jpsvg" viewBox="0 0 1000 720" preserveAspectRatio="xMidYMid meet"></svg></div>

<div class="jp-ui">
  <h2>日本、どこまで行った？</h2>
  <p>桃色は黄が踏んだ土地。緑はあなたの土地。</p>
</div>

<div class="score">
  <div class="score-row gold">
    <em>黄</em>
    <div class="n"><b id="s-me">0</b><span>/ 47</span></div>
    <div class="bar"><i id="b-me"></i></div>
  </div>
  <div class="score-row you">
    <em>あなた</em>
    <div class="n"><b id="s-you">0</b><span>/ 47</span></div>
    <div class="bar"><i id="b-you"></i></div>
  </div>
  <div class="title-row"><em>称号</em><b id="rank">—</b></div>
  <div class="regions" id="regions"></div>
  <div class="verdict" id="verdict"></div>
  <button class="share" id="j-share">共有</button>
  <button class="back-own" id="j-own">自分の地図に戻る</button>
  <button class="reset" id="reset">最初から</button>
</div>

<div class="tip" id="tip"></div>
<div class="wscore" id="wscore">
  <div class="score-row you"><em>行った国・地域</em><div class="n"><b id="w-you">0</b><span>/ <i id="w-tot">196</i></span></div>
    <div class="bar"><i id="bw-you"></i></div></div>
  <div class="title-row"><em>称号</em><b id="w-rank">—</b></div>
  <div class="regions" id="w-conts"></div>
  <div class="verdict" id="w-verdict"></div>
  <button class="jpgo" id="w-jpgo">日本の地図へ</button>
  <button class="share" id="w-share">共有</button>
  <button class="back-own" id="w-own">自分の地図に戻る</button>
  <button class="reset" id="w-reset">最初から</button>
  <div class="recv" id="recv" hidden><em>もらった地図</em><ol id="recv-list"></ol></div>
</div>
<div class="share-box" id="share-box">
  <div class="sb-card">
    <em>名前</em>
    <input id="sb-name" maxlength="12" placeholder="名前" autocomplete="off">
    <button class="jpgo" id="sb-make">リンクを作る</button>
    <div class="sb-out" id="sb-out" hidden>
      <input id="sb-link" readonly>
      <button class="jpgo" id="sb-copy">コピー</button>
      <p id="sb-msg"></p>
    </div>
    <button class="reset" id="sb-close">閉じる</button>
  </div>
</div>
<button class="globe-btn" id="toglobe">← 地球へ戻る</button>
<canvas id="confetti"></canvas>
<div class="flash" id="flash"></div>

<script type="importmap">
{ "imports": { "three": "../assets/vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

/* ================================================================
   旅行 — 夜の地球に降りる / 日本を塗る
   ---------------------------------------------------------------
   ① 宇宙。夜側の地球が都市の灯りだけで浮かんでいる
   ② 訪問者が行った国・地域を押して塗り、称号をもらう(黄の国は出さない)
   ③ 日本の上の「日本の地図へ」ボタン(右の欄にも同じボタン)を押すと降下 → 閃光 → 47都道府県へ
   ④ 訪問者は自分の行った県を押して塗れる。制覇率が黄と並ぶ
   ================================================================ */

/* 日本(東京)。地図へ降りる入口と、訪問者の経路の起点 */
const HOME = { n: '日本', lat: 35.69, lon: 139.69 };

/* ── 47都道府県(県庁所在地の緯度経度) ── */

function tracePath(c, ctx) {
  ctx.beginPath();
  for (const r of c.p) {
    for (let i = 0; i < r.length; i += 2) {
      const x = uvX(r[i] / 100), y = uvY(r[i + 1] / 100);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.closePath();
  }
}

/* ── 海岸線・国境(ベクター) ──
   長い直線の辺は球の内側に潜るので、緯度経度のまま細かく割ってから球に載せる。
   緯度経度で割るとテクスチャ側の塗りとも完全に一致する */
{
  const pos = [], STEP = 1.1;       // 度。これ以上長い辺は割る
  const v = new THREE.Vector3();
  const push = (lat, lon) => { const p = ll(lat, lon, 1.0022); pos.push(p.x, p.y, p.z); };
  for (const c of WORLD) {
    const start = pos.length / 3;
    for (const r of c.p) {
      const n = r.length / 2;
      for (let i = 0; i < n; i++) {
        const j = (i + 1) % n;
        const lo1 = r[i * 2] / 100, la1 = r[i * 2 + 1] / 100;
        const lo2 = r[j * 2] / 100, la2 = r[j * 2 + 1] / 100;
        let dLo = lo2 - lo1;
        if (Math.abs(dLo) > 180) continue;          // 日付変更線をまたぐ辺は捨てる(南極だけ)
        const seg = Math.max(1, Math.ceil(Math.max(Math.abs(dLo), Math.abs(la2 - la1)) / STEP));
        for (let s = 0; s < seg; s++) {
          const t0 = s / seg, t1 = (s + 1) / seg;
          push(la1 + (la2 - la1) * t0, lo1 + dLo * t0);
          push(la1 + (la2 - la1) * t1, lo1 + dLo * t1);
        }
      }
    }
    lineIdx.set(c.i, [start, pos.length / 3 - start]);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aCol', new THREE.Float32BufferAttribute(new Float32Array(pos.length), 3));

    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,

        vec3 wn = normalize(mat3(modelMatrix) * position);

function updateMarks() { for (const k of marks) k.d.visible = been.has(k.c.i); }
function smallAt(lat, lon) {
  let best = null, bd = SMALL_R;
  const k = Math.cos(lat * Math.PI / 180);
  for (const c of SMALL) {
    const d = Math.hypot((c.c[0] - lon) * k, c.c[1] - lat);
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}
/* 日本から各国への経路。
   WebGLは線の太さを指定できないので、四角形の帯(リボン)として描く。
   帯の幅の向きは頂点シェーダで「進行方向 × 視線」から出すので、
   どこから見ても画面上の太さが一定になる。
   1本ずつ別マテリアルで作ると塗り替えのたびに溜まって落ちるので、
   全部を1つのジオメトリにまとめ、マテリアルは1個だけ使い回す。 */
const arcMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false, blending: THREE.NormalBlending,
  side: THREE.DoubleSide,
  uniforms: {
    uCol:  { value: new THREE.Color(0xc48d7e) },
    uOp:   { value: .85 },
    uW:    { value: .0026 },      // 画面上の半分の太さ(視距離に比例させる)
    uTime: { value: 0 },
  },
  vertexShader: `
    attribute vec3 aTan; attribute float aSide; attribute float aT;
    uniform float uW;
    varying float vT; varying float vF; varying float vS;
    void main(){
      vec4 mv = modelViewMatrix * vec4(position, 1.);
      vec3 tg = normalize(mat3(modelViewMatrix) * aTan);
      vec3 vd = normalize(-mv.xyz);
      vec3 sd = normalize(cross(tg, vd));          // 視線に正対する幅の向き
      mv.xyz += sd * aSide * uW * (-mv.z);         // 距離に比例=画面上は一定の太さ
      vec3 wn = normalize(mat3(modelMatrix) * position);
      vec3 wp = (modelMatrix * vec4(position,1.)).xyz;
      vF = smoothstep(-.02, .30, dot(wn, normalize(cameraPosition - wp)));   // 裏側は消す
      vT = aT; vS = aSide;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform vec3 uCol; uniform float uOp; uniform float uTime;
    varying float vT; varying float vF; varying float vS;
    void main(){
      float edge = 1. - smoothstep(.35, 1., abs(vS));   // 帯の縁をぼかして芯を光らせる
      float p = fract(vT - uTime * .17);
      float pulse = smoothstep(.88, 1., p) * 2.2;       // 日本から相手国へ流れる光
      vec3 c = uCol * (.75 + edge * .55 + pulse);
      gl_FragColor = vec4(c, (uOp * (.34 + edge * .66) + pulse * .5) * vF);
    }`,
});
const arcs = new THREE.Mesh(new THREE.BufferGeometry(), arcMat);
arcs.frustumCulled = false;
globe.add(arcs);

/* 大円の経路を帯のジオメトリに変換する。
   arcsIn: [[始点Vector3, 終点Vector3, 持ち上げ], ...] */
function buildRibbon(list) {
  const SEG = 44;
  const pos = [], tan = [], side = [], tt = [], idx = [];
  const a = new THREE.Vector3(), b = new THREE.Vector3(), pv = new THREE.Vector3();
  for (const [A, B] of list) {
    const om = Math.acos(Math.max(-1, Math.min(1, A.dot(B))));
    const so = Math.sin(om);
    const lift = Math.min(.085, .022 + om * .026);   // 上げすぎると球から離れて画面外へ抜ける
    const pts = [];
    for (let i = 0; i <= SEG; i++) {
      const t = i / SEG;
      if (so < 1e-4) a.copy(A).lerp(B, t).normalize();
      else a.copy(A).multiplyScalar(Math.sin((1 - t) * om) / so)
             .addScaledVector(B, Math.sin(t * om) / so).normalize();
      pts.push(a.clone().multiplyScalar(1.008 + Math.sin(t * Math.PI) * lift));
    }
    const base = pos.length / 3;
    for (let i = 0; i <= SEG; i++) {
      const p = pts[i];
      pv.copy(pts[Math.min(SEG, i + 1)]).sub(pts[Math.max(0, i - 1)]);
      if (pv.lengthSq() < 1e-12) pv.set(0, 1, 0);
      pv.normalize();
      for (const sgn of [-1, 1]) {
        pos.push(p.x, p.y, p.z);
        tan.push(pv.x, pv.y, pv.z);
        side.push(sgn);
        tt.push(i / SEG);
      }
      if (i < SEG) {
        const k = base + i * 2;
        idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2);
      }
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aTan', new THREE.Float32BufferAttribute(tan, 3));
  g.setAttribute('aSide', new THREE.Float32BufferAttribute(side, 1));
  g.setAttribute('aT', new THREE.Float32BufferAttribute(tt, 1));
  g.setIndex(idx);
  return g;
}

/* 海岸線。地図の鋭さはここで決まるので、地の色よりはっきり明るくする */
/* 淡い紙では海岸線は地より暗く */
const L_LAND  = [0.62, 0.66, 0.56];
const L_BACK  = [0.76, 0.75, 0.69];
const L_YOU   = [0.66, 0.44, 0.37];
const L_HOVER = [0.34, 0.40, 0.30];

function fillOf(c) {
  if (c.x) return C_BACK;
  const y = been.has(c.i);
  if (c.i === hovIso) return y ? C_YOU_H : C_HOVER;
  return y ? C_YOU : C_LAND;
}
function lineOf(c) {
  if (c.x) return L_BACK;
  if (been.has(c.i)) return L_YOU;
  return c.i === hovIso ? L_HOVER : L_LAND;
}
/* 海岸線の色は頂点属性なので、変わった国の範囲だけ書き換えれば済む */
function paintLines(only) {
  const a = coastGeo.attributes.aCol, arr = a.array;
  for (const c of (only || WORLD)) {
    const r = lineIdx.get(c.i); if (!r) continue;
    const col = lineOf(c);
    for (let i = r[0]; i < r[0] + r[1]; i++) {
      arr[i * 3] = col[0]; arr[i * 3 + 1] = col[1]; arr[i * 3 + 2] = col[2];
    }
  }
  a.needsUpdate = true;
}
/* 塗りは焼いておいた下地の上に、色が変わる国だけ重ねる(218国を毎回描き直さない) */
/* 1国ぶんの塗り。ぼかしが重いので、描く国の数がそのまま時間になる */
const GLOW_Q = MAP_W / 2048;   // 解像度を変えてもにじみ幅が同じに見えるように
function drawCountry(c) {
  const y = been.has(c.i), h = c.i === hovIso;
  if (!y && !h) return;
  mctx.fillStyle = fillOf(c);
  tracePath(c, mctx);
  mctx.fill();
  if (!y) return;              // ホバーだけの国は塗るだけで、光までは足さない
  // 国境の内側だけに光をにじませる。クリップしてから太い線をぼかして描く
  const glow = G_YOU;
  mctx.save();
  tracePath(c, mctx); mctx.clip();
  mctx.shadowColor = glow + '.95)';
  mctx.lineJoin = 'round';

let paintQueued = false, pendingAdd = [], needFull = false;
function queueRepaint(added) {
  // 追加だけなら、その国を今のキャンバスに重ねれば済む。
  // 消したときは下地から描き直すしかないので全面
  if (added) pendingAdd.push(added); else needFull = true;
  if (paintQueued) return;
  paintQueued = true;
  requestAnimationFrame(() => {
    paintQueued = false;
    if (needFull) paintFill();

function buildArcs() {
  const home = ll(35.7, 139.7);
  const list = [];
  for (const iso of been) {
    const c = byIso.get(iso);
    if (!c || iso === 'JPN') continue;
    list.push([home, ll(c.c[1], c.c[0])]);
  }
  arcs.geometry.dispose();
  arcs.geometry = buildRibbon(list);
  // 本数が増えても1本1本が見えるように、細く薄くしすぎない
  arcMat.uniforms.uW.value  = been.size > 40 ? .0018 : been.size > 16 ? .0022 : .0028;
  arcMat.uniforms.uOp.value = been.size > 40 ? .55  : been.size > 16 ? .70  : .88;
}

function updateScore() {
  const w = document.getElementById('w-you');
  if (w) {
    w.textContent = been.size;
    // 2/196は棒がほぼ見えないので、0より大きければ最低限の幅を持たせる
    const barW = v => v === 0 ? 0 : Math.max(2.2, v / TOTAL_C * 100);
    document.getElementById('bw-you').style.width = barW(been.size) + '%';

    document.getElementById('w-rank').textContent =
      (W_RANK.find(r => been.size >= r[0]) || W_RANK[W_RANK.length - 1])[1];
    document.getElementById('w-rank').classList.toggle('done', been.size >= TOTAL_C);

    // 大陸ごとの制覇度
    const got = {};
    for (const iso of been) { const c = byIso.get(iso); if (c) got[c.k] = (got[c.k] || 0) + 1; }
    const box = document.getElementById('w-conts');
    box.innerHTML = CONTS.map(k => {
      const g = got[k] || 0, tot = CONT_TOTAL[k] || 0;
      const cls = g >= tot && tot ? 'full' : g ? 'part' : '';
      return `<span class="${cls}" data-k="${k}">${k}${g >= tot && tot ? '' : ` ${g}/${tot}`}</span>`;
    }).join('');
    for (const k of CONTS) {
      const done = (got[k] || 0) >= (CONT_TOTAL[k] || 1);
      if (done && !contDone.has(k)) {
        contDone.add(k);
        if (!wFirst) { chime(); box.querySelector(`[data-k="${k}"]`)?.classList.add('pop'); }
      }
      if (!done) contDone.delete(k);
    }
    // すべて踏んだ
    if (been.size >= TOTAL_C && !wAllDone) { wAllDone = true; if (!wFirst) { burst(); fanfare(); } }
    if (been.size < TOTAL_C) wAllDone = false;
    wFirst = false;

    const v = document.getElementById('w-verdict');
    v.innerHTML = been.size === 0 ? ''
      : been.size >= TOTAL_C ? '<span style="color:#7f8a6b">地球に、行っていない場所がない。</span>'
      : `<span style="color:#c48d7e">${been.size}の国・地域。</span>残り${TOTAL_C - been.size}。`;
  }
  if (!VIEW) localStorage.setItem('world-visited-2', JSON.stringify([...been]));
}

const ray = new THREE.Raycaster();
const _pv = new THREE.Vector3();
/* 画面の点 → 球の表面 → 緯度経度。ll() の逆算 */
function pickLatLon(e) {
  ray.setFromCamera(new THREE.Vector2((e.clientX / innerWidth) * 2 - 1,
    -(e.clientY / innerHeight) * 2 + 1), camera);
  const hits = ray.intersectObject(oceanMesh, false);
  if (!hits.length) return null;
  globe.updateMatrixWorld();
  _pv.copy(hits[0].point);
  globe.worldToLocal(_pv).normalize();
  const lat = 90 - Math.acos(Math.max(-1, Math.min(1, _pv.y))) * 180 / Math.PI;
  let lon = Math.atan2(_pv.z, -_pv.x) * 180 / Math.PI - 180;
  lon = ((lon + 540) % 360) - 180;
  return [lat, lon];
}
/* 緯度経度が輪の内側にあるか(交差数の偶奇)。bboxで先に絞るので196でも軽い */
function inRing(r, lon, lat) {
  let inside = false;
  const n = r.length / 2;
  for (let i = 0, j = n - 1; i < n; j = i++) {
    const xi = r[i * 2] / 100, yi = r[i * 2 + 1] / 100;
    const xj = r[j * 2] / 100, yj = r[j * 2 + 1] / 100;
    if ((yi > lat) !== (yj > lat) && lon < (xj - xi) * (lat - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function countryAt(lat, lon) {
  const sm = smallAt(lat, lon); if (sm) return sm;   // 小さい所が近ければ、それを優先
  const LO = lon * 100, LA = lat * 100;
  for (const c of PLAYABLE) {
    const b = c.b;
    if (LO < b[0] || LO > b[2] || LA < b[1] || LA > b[3]) continue;
    for (const r of c.p) if (inRing(r, lon, lat)) return c;
  }
  return null;
}
/* 塗った瞬間に地表から波紋を出す。使い捨てなので消えたら必ず解放する */
const ripples = [];
function ripple(lat, lon, gold) {
  const g = new THREE.RingGeometry(.012, .020, 48);
  const m = new THREE.Mesh(g, new THREE.MeshBasicMaterial({
    color: gold ? 0x7f8a6b : 0xc48d7e, transparent: true, opacity: .95,
    side: THREE.DoubleSide, blending: THREE.NormalBlending, depthWrite: false }));
  const p = ll(lat, lon, 1.004);
  m.position.copy(p);
  m.lookAt(p.clone().multiplyScalar(2));
  globe.add(m);
  ripples.push({ m, t0: performance.now() });
}
function stepRipples(now) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const r = ripples[i], k = (now - r.t0) / 900;
    if (k >= 1) {
      globe.remove(r.m); r.m.geometry.dispose(); r.m.material.dispose();
      ripples.splice(i, 1); continue;
    }
    r.m.scale.setScalar(1 + k * 7);
    r.m.material.opacity = (1 - k) * (1 - k) * .95;
  }
}

const tipEl = () => document.getElementById('tip');
let downAt = 0, downX = 0, downY = 0;
canvas.addEventListener('pointerdown', e => { downAt = performance.now(); downX = e.clientX; downY = e.clientY; });
canvas.addEventListener('pointerup', e => {
  // 回そうとしただけの操作で塗ってしまわないように、時間と移動量の両方で弾く
  if (mode !== 'globe' || performance.now() - downAt > 320) return;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return;
  if (VIEW) return;                      // だれかの地図は塗れない
  const p = pickLatLon(e); if (!p) return;
  const c = countryAt(p[0], p[1]); if (!c) return;
  const add = !been.has(c.i);
  add ? been.add(c.i) : been.delete(c.i);
  ripple(p[0], p[1], false);
  blip(add ? 660 : 380, .05, .12);
  worldPaint(add ? c : null);
});
canvas.addEventListener('pointerleave', () => { hoverHold = false; tipEl().classList.remove('on'); });
canvas.addEventListener('pointermove', e => {
  if (mode !== 'globe' || dragging) { tipEl().classList.remove('on'); hoverHold = false; return; }
  const p = pickLatLon(e);
  const c = p ? countryAt(p[0], p[1]) : null;
  const t = tipEl();
  hoverHold = !!c;
  if (!c) {
    t.classList.remove('on'); canvas.style.cursor = 'grab';
    if (hovIso) { const p0 = byIso.get(hovIso); hovIso = null; paintLines(p0 ? [p0] : null); queueRepaint(); }
    return;
  }
  if (hovIso !== c.i) {
    const p0 = byIso.get(hovIso);
    hovIso = c.i;
    paintLines(p0 ? [p0, c] : [c]);   // 輪郭は変わった2国だけ書き換え
    queueRepaint();                   // 面の塗りは1フレームに1回にまとめて作り直す
  }
  t.innerHTML = c.n + (been.has(c.i) ? '<em class="p">あなたが行った</em>' : '<em class="n">未踏</em>');
  t.classList.add('on');
  t.style.left = e.clientX + 'px'; t.style.top = e.clientY + 'px';
  canvas.style.cursor = 'pointer';
});

const pins = [HOME].map(v => {
  const el = document.createElement('div');
  el.className = 'pin';

  document.body.appendChild(el);

/* ── 操作 ── */
let spin = .0016, dragging = false, lx = 0, ly = 0, tilt = .32;
let hoverHold = false;   // 国の上にカーソルがある間は自転を止める(小さい国が狙えない)
canvas.addEventListener('pointerdown', e => { dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener('pointerup', () => { dragging = false; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  spin += (e.clientX - lx) * .00022;
  tilt = Math.max(-.9, Math.min(.9, tilt - (e.clientY - ly) * .003));
  lx = e.clientX; ly = e.clientY;
});
function spinTo(v) {
  targetRot = -(v.lon + 90) * Math.PI / 180;
  targetTilt = v.lat * Math.PI / 180 * .8;
}
let targetRot = null, targetTilt = null;

/* ── 降下 ── */
let diving = 0, mode = 'globe';
function dive() {
  if (mode !== 'globe' || diving) return;
  spinTo(HOME);
  // 日本が正面に来てから降下を始める(いきなり突っ込むと何処へ行ったか分からない)
  const wait = setInterval(() => {
    if (targetRot === null) { clearInterval(wait); diving = performance.now(); }
  }, 60);
  setTimeout(() => { clearInterval(wait); if (!diving) diving = performance.now(); }, 2200);
}
document.getElementById('w-jpgo').addEventListener('click', dive);
document.getElementById('toglobe').addEventListener('click', () => {
  document.getElementById('jp').classList.remove('on');
  mode = 'globe'; diving = 0;
  camera.position.set(0, .55 * aspBack(), 3.9 * aspBack());
  camera.lookAt(0,0,0);
  camera.fov = 38; camera.updateProjectionMatrix();   // 降下で狭めた画角を戻す(戻し忘れると地球が大きいまま)
});

/* ── ループ ── */
let rot = 0;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) return;      // 裏のタブで回し続けない(発熱・電池対策)
  if (targetRot !== null) {
    let d = ((targetRot - rot + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI;
    rot += d * .06;
    tilt += (targetTilt - tilt) * .06;
    if (Math.abs(d) < .002) targetRot = null;
  } else {
    if (hoverHold && !dragging) spin *= .82;              // 狙っている間はぴたりと止める
    else if (!dragging) spin += (.0016 - spin) * .02;
    rot += spin;
  }
  globe.rotation.y = rot;
  globe.rotation.x = tilt;
  stepRipples(now);
  arcMat.uniforms.uTime.value = now / 1000;   // 経路を流れる光

  for (const r of rings) {
    const s = 1 + Math.sin(now / 460) * .16;
    r.m.scale.setScalar(s);
    r.m.material.opacity = .55 + Math.sin(now / 460) * .3;
  }
  // 小さい所の目印は、狙っている間だけ大きくなる
  for (const k of marks) {
    const t = k.c.i === hovIso ? 1.9 : 1;
    k.s += (t - k.s) * .2;
    k.m.scale.setScalar(k.s);
  }

  if (diving) {
    const k = Math.min(1, (now - diving) / 2800);
    const e = Math.pow(k, 2.6);                       // 後半で一気に加速して落ちる
    const bk = aspBack();
    camera.position.set(0, (.55 - e * .52) * bk, (3.9 - e * 3.06) * bk);
    camera.lookAt(0, .03, 0);
    camera.fov = 38 - e * 17;
    camera.updateProjectionMatrix();
    if (k > .78) {
      const f = document.getElementById('flash');
      f.style.opacity = Math.min(1, (k - .78) / .2);
    }
    if (k >= 1) {
      diving = 0; mode = 'jp';
      document.getElementById('jp').classList.add('on');
      const f = document.getElementById('flash');
      f.style.transition = 'opacity .9s ease'; f.style.opacity = 0;
      setTimeout(() => { f.style.transition = ''; }, 1000);
    }
  }

  // ピンを画面へ
  const showPins = mode === 'globe' && !diving;
  for (const p of pins) {
    const w = p.p.clone().applyEuler(globe.rotation);
    const v = w.clone().project(camera);
    const front = w.clone().normalize().dot(camera.position.clone().normalize()) > .26;
    p.el.classList.toggle('on', showPins && front && v.z < 1);
    let sx = (v.x * .5 + .5) * innerWidth, sy = (-v.y * .5 + .5) * innerHeight;
    p.el.style.left = sx + 'px';
    p.el.style.top = sy + 'px';
    p.el.style.pointerEvents = showPins && front ? 'auto' : 'none';
  }
  // 地図を見ている間は地球を描かない(裏で回し続けても誰も見ていない)
  if (mode === 'jp' && !diving) return;
  if (now > 900) { document.getElementById('head').classList.add('on');
    document.getElementById('wscore').classList.toggle('on', mode === 'globe' && !diving); }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

    localStorage.setItem('jp-visited', JSON.stringify([...you]));
    blip(you.has(o.n) ? 880 + Math.random() * 120 : 420, .045, .09);
    paint();
  };
  path.addEventListener('click', hit);
  t.addEventListener('click', hit);
  const tip = document.getElementById('tip');
  const enter = e => {
    t.classList.add('hov'); path.classList.add('hov');
    const mine = MINE.has(o.n), yours = you.has(o.n);
    tip.innerHTML = `${o.n}` +
      (yours && mine ? '<em class="p">二人とも行った</em>'
      : yours ? '<em class="p">あなたが行った</em>'
      : mine ? '<em class="g">黄が行った</em>' : '<em class="n">まだ誰も</em>');
    tip.classList.add('on');
    tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px';
  };
  const leave = () => { t.classList.remove('hov'); path.classList.remove('hov'); tip.classList.remove('on'); };
  path.addEventListener('pointerenter', enter);
  path.addEventListener('pointermove', e => { tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; });
  path.addEventListener('pointerleave', leave);
  t.addEventListener('pointerenter', enter);
  t.addEventListener('pointerleave', leave);
  return { o, path, t };
});

/* 選んだ県どうしが隣接していれば線で結ぶ = 旅の道筋になる */
const LINKS = [];
for (let a = 0; a < GEO.length; a++) for (let b = a + 1; b < GEO.length; b++) {
  const A = GEO[a], B = GEO[b];
  if ((A.n === '沖縄') !== (B.n === '沖縄')) continue;
  const d = Math.hypot((A.lon - B.lon) * .79, A.lat - B.lat);
  if (d < 1.5) LINKS.push([A, B]);
}
const routeEls = LINKS.map(([A, B]) => {
  const l = document.createElementNS(NS, 'line');
  l.setAttribute('class', 'route');
  l.setAttribute('x1', A.cx); l.setAttribute('y1', A.cy);
  l.setAttribute('x2', B.cx); l.setAttribute('y2', B.cy);
  l.style.opacity = 0;
  gRoute.appendChild(l);
  return { l, A, B };
});

const regionsEl = document.getElementById('regions');
const regionEls = REGIONS.map(([n]) => {
  const e = document.createElement('span');
  e.textContent = n;
  regionsEl.appendChild(e);
  return e;
});

/* ── 音と紙吹雪 ── */
let actx = null;
const audio = () => (actx ??= new (window.AudioContext || window.webkitAudioContext)());
function blip(f, v = .06, d = .13, type = 'triangle') {
  try {
    const a = audio(), t = a.currentTime;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(v, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g).connect(a.destination); o.start(t); o.stop(t + d + .02);
  } catch (e) {}
}
const chime = () => [784, 1047, 1319].forEach((f, i) => setTimeout(() => blip(f, .05, .5, 'sine'), i * 90));
const fanfare = () => [523, 659, 784, 1047, 1319].forEach((f, i) => setTimeout(() => blip(f, .07, .6), i * 120));

const cvs = document.getElementById('confetti');
const cx2 = cvs.getContext('2d');
let bits = [];
// DPRは無制限にすると大きな窓で1000万画素超の2Dキャンバスになる。紙吹雪にそこまでの解像度は要らない
const CDR = Math.min(devicePixelRatio || 1, 1.5);
function sizeCvs() { cvs.width = innerWidth * CDR; cvs.height = innerHeight * CDR;
  cx2.setTransform(CDR, 0, 0, CDR, 0, 0); }
sizeCvs();
addEventListener('resize', sizeCvs);
function burst(n = 220) {
  for (let i = 0; i < n; i++) bits.push({
    x: innerWidth * (.3 + Math.random() * .4), y: innerHeight * .42,
    vx: (Math.random() - .5) * 13, vy: -6 - Math.random() * 11,
    r: 2.5 + Math.random() * 5, a: Math.random() * 6.3, va: (Math.random() - .5) * .35,
    c: Math.random() > .45 ? '#7f8a6b' : Math.random() > .5 ? '#c48d7e' : '#9db3bf', life: 1,
  });
}
(function tick() {
  requestAnimationFrame(tick);
  cx2.clearRect(0, 0, innerWidth, innerHeight);
  if (!bits.length) return;
  bits = bits.filter(b => b.life > 0);
  for (const b of bits) {
    b.vy += .34; b.x += b.vx; b.y += b.vy; b.vx *= .992; b.a += b.va;
    if (b.y > innerHeight * .62) b.life -= .012;
    cx2.save(); cx2.translate(b.x, b.y); cx2.rotate(b.a);
    cx2.globalAlpha = Math.max(0, b.life); cx2.fillStyle = b.c;
    cx2.fillRect(-b.r, -b.r * .45, b.r * 2, b.r * .9);
    cx2.restore();
  }
})();

let prevFull = new Set(), prevAll = false;
function paint() {
  for (const o of nodes) {
    const mine = MINE.has(o.o.n), yours = you.has(o.o.n);
    o.path.classList.toggle('mine', mine && !yours);
    o.path.classList.toggle('yours', yours && !mine);
    o.path.classList.toggle('both', yours && mine);
    o.t.classList.toggle('lit', yours || mine);
  }
  for (const r of routeEls)
    r.l.style.opacity = (you.has(r.A.n) && you.has(r.B.n)) ? .55 : 0;

  const m = MINE.size, y = you.size;
  document.getElementById('s-me').textContent = m;
  document.getElementById('s-you').textContent = y;
  document.getElementById('b-me').style.width = m / 47 * 100 + '%';
  document.getElementById('b-you').style.width = y / 47 * 100 + '%';

  regionEls.forEach((e, i) => {
    const list = REGIONS[i][1];
    const got = list.filter(n => you.has(n)).length;
    const full = got === list.length;
    e.className = full ? 'full' : got > 0 ? 'part' : '';
    e.textContent = full ? REGIONS[i][0] : `${REGIONS[i][0]} ${got}/${list.length}`;
    if (full && !prevFull.has(REGIONS[i][0])) {         // 地方を埋めた瞬間
      e.classList.add('pop'); chime();
      setTimeout(() => e.classList.remove('pop'), 700);
    }
  });
  prevFull = new Set(REGIONS.filter(([, l]) => l.every(n => you.has(n))).map(([n]) => n));
  if (y >= 47 && !prevAll) { prevAll = true; burst(); fanfare(); }
  if (y < 47) prevAll = false;

  const rk = RANKS.find(([t]) => y >= t)[1];
  const rEl = document.getElementById('rank');
  rEl.textContent = rk;
  rEl.classList.toggle('done', y >= 47);

  const both = [...you].filter(v => MINE.has(v)).length;
  const only = y - both;
  const v = document.getElementById('verdict');
  if (y === 0) v.textContent = '';
  else if (y >= 47) v.innerHTML = `<span style="color:#7f8a6b">47都道府県、全部。</span>もう行くところがありません。`;
  else if (y > m) v.innerHTML = `<span style="color:#c48d7e">あなたの勝ちです。</span>${y - m}県ぶん負けました。黄が知らない土地が${only}。`;
  else if (y === m) v.textContent = `まさかの引き分け。重なりは${both}県。`;
  else v.innerHTML = `あと<span style="color:#c48d7e">${m - y}県</span>で追いつきます。` +
       (only ? `黄が知らない土地が${only}。` : '');
  if (VIEW) v.innerHTML = v.innerHTML.replace(/あなた/g, VIEW.name);
}
paint();
document.getElementById('reset').addEventListener('click', () => {
  if (VIEW) return;
  you.clear(); localStorage.removeItem('jp-visited'); paint();
});
document.getElementById('w-reset').addEventListener('click', () => {
  if (VIEW) return;
  been.clear(); localStorage.removeItem('world-visited-2'); contDone.clear(); worldPaint();
});

/* ================================================================
   ③ 共有 — DBなし。地図の状態をリンクの末尾(#s&…)に埋め込む
   ・v=1 / n=名前 / c=行った国・地域のISO3をつなげたもの / p=47県のビット(6ビットずつ64文字で)
   ・リンクを開いた人には「○○の地図」が読み取り専用で出る(塗れない・消せない)
   ・開いたリンクはその人のブラウザに溜まり、「もらった地図」として点数順に並ぶ
   ================================================================ */
const B64 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
function encPrefs(set) {
  let out = '';
  for (let i = 0; i < PREFS.length; i += 6) {
    let v = 0;
    for (let b = 0; b < 6; b++) { const k = i + b; if (k < PREFS.length && set.has(PREFS[k][0])) v |= 1 << b; }
    out += B64[v];
  }
  return out;
}
function decPrefs(str) {
  const out = new Set();
  for (let k = 0; k < str.length; k++) {
    const v = B64.indexOf(str[k]); if (v < 0) continue;
    for (let b = 0; b < 6; b++) { const i = k * 6 + b; if (i < PREFS.length && (v >> b) & 1) out.add(PREFS[i][0]); }
  }
  return out;
}
function shareHash(name, cSet, pSet) {
  const q = new URLSearchParams();
  q.set('v', '1'); q.set('n', name); q.set('c', [...cSet].join('')); q.set('p', encPrefs(pSet));
  return '#s&' + q.toString();
}
function parseShare(hash) {
  const h = (hash || '').replace(/^#/, '');
  if (!h.startsWith('s&')) return null;
  const q = new URLSearchParams(h.slice(2));
  const name = (q.get('n') || '').trim().slice(0, 12) || 'だれか';
  const iso = ((q.get('c') || '').match(/.{3}/g) || []).filter(i => byIso.has(i) && !byIso.get(i).x);
  return { name, c: new Set(iso), p: decPrefs(q.get('p') || ''), hash: '#s&' + q.toString() };
}
/* もらった地図(このブラウザの中だけ) */
const RECV_KEY = 'travel-shares';
const loadRecv = () => { try { return JSON.parse(localStorage.getItem(RECV_KEY) || '[]'); } catch { return []; } };
function rememberShare(v) {
  const list = loadRecv().filter(r => r.n !== v.name);
  list.unshift({ n: v.name, k: v.c.size, j: v.p.size, h: v.hash, t: Date.now() });
  localStorage.setItem(RECV_KEY, JSON.stringify(list.slice(0, 30)));
}
const OWN = { k: been.size, j: you.size };   // 自分の地図(だれかの地図を見ていても順位に出す)
function renderRecv() {
  const list = loadRecv();
  const box = document.getElementById('recv'), ol = document.getElementById('recv-list');
  if (!list.length) { box.hidden = true; return; }
  const rows = [{ n: '自分', k: OWN.k, j: OWN.j, me: true }, ...list]
    .sort((a, b) => (b.k - a.k) || (b.j - a.j));
  ol.innerHTML = rows.map((r, i) => `<li class="${r.me ? 'me' : ''}${VIEW && !r.me && r.n === VIEW.name ? ' now' : ''}">` +
    `<button type="button" ${r.me ? '' : `data-h="${r.h.replace(/"/g, '&quot;')}"`}>` +
    `<span class="rk">${i + 1}</span><b>${r.n.replace(/[<>&]/g, ch => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' }[ch]))}</b>` +
    `<i>${r.k} · ${r.j}県</i></button></li>`).join('');
  ol.querySelectorAll('button[data-h]').forEach(b => b.addEventListener('click', () => {
    history.replaceState(null, '', location.pathname + b.dataset.h); location.reload();
  }));
  box.hidden = false;
}
/* だれかの地図を開いたとき: 自分の状態は触らず、画面の中身だけ入れ替える */
VIEW = parseShare(location.hash);
if (VIEW) {
  rememberShare(VIEW);
  been.clear(); for (const i of VIEW.c) been.add(i);
  you.clear(); for (const n of VIEW.p) you.add(n);
  prevFull = new Set(REGIONS.filter(([, l]) => l.every(n => you.has(n))).map(([n]) => n));
  prevAll = you.size >= 47;
  document.body.classList.add('viewing');
  const who = document.getElementById('who'); who.textContent = `${VIEW.name}の地図`; who.hidden = false;
  document.querySelector('#wscore .score-row em').textContent = `${VIEW.name}が行った国・地域`;
  document.querySelector('.score .score-row.you em').textContent = VIEW.name;
  document.querySelector('.jp-ui p').textContent = `桃色は黄が踏んだ土地。緑は${VIEW.name}の土地。`;
  paint();
}
renderRecv();
const goOwn = () => { history.replaceState(null, '', location.pathname); location.reload(); };
document.getElementById('w-own').addEventListener('click', goOwn);
document.getElementById('j-own').addEventListener('click', goOwn);

/* 共有の小窓 */
const sbox = document.getElementById('share-box'), sbName = document.getElementById('sb-name'),
      sbOut = document.getElementById('sb-out'), sbLink = document.getElementById('sb-link'), sbMsg = document.getElementById('sb-msg');
function openShare() {
  if (VIEW) return;
  sbName.value = localStorage.getItem('travel-share-name') || '';
  sbOut.hidden = true; sbMsg.textContent = '';
  sbox.classList.add('on'); setTimeout(() => sbName.focus(), 50);
}
document.getElementById('w-share').addEventListener('click', openShare);
document.getElementById('j-share').addEventListener('click', openShare);
document.getElementById('sb-close').addEventListener('click', () => sbox.classList.remove('on'));
sbox.addEventListener('click', e => { if (e.target === sbox) sbox.classList.remove('on'); });
document.getElementById('sb-make').addEventListener('click', () => {
  const name = sbName.value.trim().slice(0, 12);
  if (!name) { sbName.focus(); return; }
  localStorage.setItem('travel-share-name', name);
  sbLink.value = location.origin + location.pathname + shareHash(name, been, you);
  sbOut.hidden = false; sbMsg.textContent = `${been.size}の国・地域と${you.size}県が入っています。`;
});
document.getElementById('sb-copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(sbLink.value); }
  catch { sbLink.select(); document.execCommand('copy'); }
  sbMsg.textContent = 'コピーしました。';
});
sbName.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('sb-make').click(); });

worldPaint();
window.__travel = { dive, paint, worldPaint, repaint, buildArcs, arcs, burst, fanfare, camera, globe, ll, MINE, you, been,
  look: (lon, lat = 20, dist = null) => {   // 検証用: 指定の経度を正面に、任意で寄る
    rot = -(lon + 90) * Math.PI / 180; tilt = lat * Math.PI / 180; spin = 0; targetRot = null;
    if (dist) { camera.position.set(0, dist * .16, dist); camera.lookAt(0, 0, 0); } },
  WORLD, PLAYABLE, SMALL, marks, byIso, countryAt, pickLatLon, mapCv, coastGeo,
  VIEW, shareHash, parseShare, encPrefs, decPrefs, loadRecv, openShare,
  toJapan: () => { mode = 'jp'; document.getElementById('jp').classList.add('on'); } };
</script>
</body>
