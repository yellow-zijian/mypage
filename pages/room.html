<!doctype html>

<style>
  * { margin:0; padding:0; box-sizing:border-box; }

    transition:all .2s ease; }
  .bar button:hover { background:rgba(196,141,126,.12); border-color:#c48d7e; box-shadow:0 0 14px rgba(196,141,126,.25); }
  .bar button:active { transform:scale(.92); }

  .bubble.on { opacity:1; }
  .bubble.kid { color:#c48d7e; border-color:rgba(196,141,126,.35); }

  .card { position:fixed; z-index:16; right:clamp(18px, 2.5vw, 40px); top:50%; transform:translate(24px, -50%);

    background:rgba(255,251,244,.9); border:1px solid rgba(96,102,88,.16); border-radius:18px;

  .steam { width:12px; height:12px; border-radius:50%; background:rgba(255,255,255,.85); filter:blur(4px); animation: steam 1.6s ease-out forwards; }

  @keyframes pulse { 0%,100% { transform:scale(.7); opacity:.5; } 50% { transform:scale(1.3); opacity:1; } }

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../assets/vendor/loaders/GLTFLoader.js';
import { RoomEnvironment } from '../assets/vendor/environments/RoomEnvironment.js';

/* ================================================================
   部屋 — 3頭身の黄と5歳の息子が、昼下がりの2部屋で暮らす
   ---------------------------------------------------------------
   ① 箱庭の部屋が組み上がり、黄がドアから入ってきて手を振る。息子は隣の子ども部屋で遊んでいる
   ② 床を押すとそこへ歩く。家具を押すと、歩いて行ってそれを使う
   ③ 子ども部屋の家具(と息子本人)を押すと、親子の互动が始まる(一緒にゲーム/滑り台/勉強/絵本/積み木/高い高い/お絵かき/寝かしつけ)
   ④ 放っておくと勝手に暮らす。カメラは黄について部屋間を移動する。仕切り壁は腰の高さの固定壁(開口から行き来)
   モデル: assets/models/room.glb / chibi.glb / kid.glb(blender/*.py で生成。room.glb は AO を頂点色に焼き込み済み)
   ================================================================ */

const ROOM_V = 15;   // glb を作り直したら +1
const EMBED = new URLSearchParams(location.search).has('embed');   // landing page の iframe として動くとき
// 部屋は landing に移植済みなので単独ページとしては開かない(検証用に ?solo=1 だけ通す)
if (!EMBED && !new URLSearchParams(location.search).has('solo')) location.replace('../index.html');
if (EMBED) document.body.classList.add('embed');
const $ = s => document.querySelector(s);
const stage = $('#stage');
const PI = Math.PI;

/* ---------- 黄ひとりの行動(座標は glTF: x, z。Blender の +y は -z) ---------- */
const HILITE = new THREE.Color('#e0b04a');
const ACTS = {
  work:   { name:'仕事',    bubble:'仕事中…',       anim:'Type',    spot:[2.1, -2.2],    approach:[2.1, -1.6],   yaw:PI,     yoff:-0.06, dur:9,
            hit:['f_desk', 'f_chair'], props:[], fx:'monitor', text:'最新のAIを、最古の機械で動かしている。' },
  tv:     { name:'テレビ',  bubble:'テレビ中',      anim:'Watch',   spot:[1.05, -1.75],  approach:[0.25, -1.75], yaw:-PI/2,  yoff:-0.14, dur:8,
            hit:['f_sofa', 'f_tv'], props:[], fx:'tv', text:'旅番組で行った気になる。航空券より安い。' },
  game:   { name:'ゲーム',  bubble:'ゲーム中',      anim:'Game',    spot:[-0.55, -0.55], approach:[0.45, -0.55], look:[-1.05, -1.75], yoff:-0.28, dur:9,
            hit:['f_beanbag'], props:[['pad', 'handR', [-0.09, 0.02, 0.02], [PI, 0, 0]]], fx:'game', text:'積みゲーを一本崩した。セールで三本積んだ。' },
  sleep:  { name:'昼寝',    bubble:'昼寝中 zzz',    anim:'Sleep',   spot:[-3.35, -1.3],  approach:[-3.2, -0.8],  yaw:0,      yoff:0.48,  dur:8,
            hit:['f_bed'], props:[], fx:'sleep', text:'猫の呼吸を数えていたら、こちらが眠っていた。' },
  read:   { name:'読書',    bubble:'読書中',        anim:'ReadSit', spot:[2.75, 1.5],    approach:[3.35, 2.1],   yaw:PI/4,   yoff:-0.02, dur:8,
            hit:['f_armchair', 'f_shelf'], props:[['book', 'handL', [0.13, 0.03, 0.03], [PI - 0.9, 0, 0]]], fx:'read', text:'買えない物件の間取りほど、よく読める。' },
  lift:   { name:'筋トレ',  bubble:'筋トレ中',      anim:'Lift',    spot:[-0.6, 2.5],    approach:[-1.05, 2.5],  yaw:PI/2,   yoff:0,     dur:7,
            hit:['f_rack'], props:[['dumbbell', 'handL', [0, 0.02, 0], [PI, 0, 0]], ['dumbbell', 'handR', [0, 0.02, 0], [PI, 0, 0]]], fx:'lift', text:'今日は腕の日。脚の日は今週も延期した。' },
  coffee: { name:'お茶',    bubble:'お茶中',        anim:'Drink',   spot:[-3.05, 1.6],   approach:[-3.05, 1.6],  yaw:-PI/2,  yoff:0,     dur:6,
            hit:['f_kitchen'], props:[['cup', 'handR', [0, 0.04, 0.02], [PI, PI/2, 0]]], fx:'coffee', text:'立ったまま飲む。座ると夕方になる。' },
  water:  { name:'水やり',  bubble:'水やり中',      anim:'Water',   spot:[1.5, 2.45],    approach:[1.5, 2.45],   yaw:0,      yoff:0,     dur:6,
            hit:['f_plant'], props:[['can', 'handR', [0, 0.04, 0.03], [PI, -PI/2, 0]]], fx:'water', text:'まだ枯らしていない。この鉢は三代目だが。' },
  supp:   { name:'サプリ',  bubble:'サプリ中',      anim:'Supp',    spot:[-3.25, -0.1],  approach:[-3.25, -0.1], yaw:-PI/2,  yoff:0,     dur:7,
            hit:['f_supp'], props:[['shaker', 'handR', [0, 0.03, 0.0], [PI/2, 0, 0]]], fx:'supp', text:'効いたかどうかは、力こぶで確認している。' },
};
/* ---------- 息子との互动(DUO)。dad/kid それぞれの spot・向き・アニメ ---------- */
const DUO = {
  game2:  { name:'一緒にゲーム', bubble:'対戦中', kb:'まけないよ', dur:11, hit:['f_ktv', 'f_kcushions'], fx:'ktv',
            dad:{ spot:[5.25, -1.35], approach:[5.9, -1.35], yaw:-PI/2, yoff:-0.38, anim:'Game', props:[['pad', 'handR', [-0.09, 0.02, 0.02], [PI, 0, 0]]] },
            kid:{ spot:[5.25, -1.85], approach:[5.9, -1.85], yaw:-PI/2, yoff:-0.2,  anim:'Game', props:[['kpad', 'handR', [-0.06, 0.015, 0.015], [PI, 0, 0]]] },
            text:'本気でやって負けた。積みゲーは経験値にならない。' },
  slide:  { name:'滑り台',      bubble:'受け止め係', kb:'もういっかい！', dur:16, hit:['f_slide'], fx:'', special:'slide',
            dad:{ spot:[6.75, 0.85], approach:[6.75, 0.85], yaw:PI/2, yoff:0, anim:'Catch', props:[] },
            kid:{ spot:[9.6, 0.5], approach:[9.6, 0.5], yaw:-PI/2, yoff:0, anim:'Idle', props:[] },
            text:'何度でも受け止める。膝のほうは、あと数回だ。' },
  study:  { name:'勉強を見る',   bubble:'先生役', kb:'わかった！', dur:11, hit:['f_kdesk', 'f_kchairs'], fx:'',
            dad:{ spot:[6.45, -2.25], approach:[6.45, -1.6], yaw:PI, yoff:-0.2, anim:'Point', props:[] },
            kid:{ spot:[5.85, -2.25], approach:[5.85, -1.6], yaw:PI, yoff:-0.03, anim:'Study', props:[['pencil', 'handR', [0, 0.02, 0.01], [PI/2, 0, 0]]] },
            text:'ぬ、で鉛筆が止まる。実は私も未だに苦手な字だ。' },
  book:   { name:'絵本',        bubble:'読み聞かせ中', kb:'それで？', dur:11, hit:['f_tent', 'f_toyshelf'], fx:'',
            dad:{ spot:[5.7, 2.1], approach:[6.3, 2.1], yaw:PI/2, yoff:0, anim:'ReadFloor', props:[['book', 'handL', [0.13, 0.03, 0.03], [PI - 0.9, 0, 0]]] },
            kid:{ spot:[5.7, 1.65], approach:[6.3, 1.65], yaw:PI/2, yoff:0, anim:'Listen', props:[] },
            text:'狼の声を本気で出したら、首をかしげられた。' },
  blocks: { name:'積み木',      bubble:'積み木中', kb:'たかくして', dur:12, hit:['f_blocks'], fx:'', special:'blocks',
            dad:{ spot:[5.95, 1.5], approach:[5.95, 1.0], yaw:PI/2, yoff:0, anim:'Blocks', props:[] },
            kid:{ spot:[6.75, 1.5], approach:[6.75, 1.0], yaw:-PI/2, yoff:0, anim:'Blocks', props:[] },
            text:'六個目。ふたりとも息を止めている。' },
  high:   { name:'高い高い',     bubble:'高い高い中', kb:'たかーい！', dur:9, hit:['kid'], fx:'', special:'high',
            dad:{ spot:[7.4, -0.6], approach:[7.4, -0.6], yaw:PI/4, yoff:0, anim:'HighHigh', props:[] },
            kid:{ spot:[7.75, -0.25], approach:[7.75, -0.25], yaw:PI/4 + PI, yoff:0, anim:'Cheer', props:[] },
            text:'去年より重い。去年より天井に近い。' },
  draw:   { name:'お絵かき',     bubble:'お絵かき中', kb:'パパもかいて', dur:11, hit:['f_ktable'], fx:'',
            dad:{ spot:[6.2, -1.35], approach:[6.2, -1.9], yaw:0, yoff:-0.23, anim:'DrawSit', props:[['crayon', 'handR', [0, 0.03, 0.01], [PI/2, 0, 0]]] },
            kid:{ spot:[6.2, -0.25], approach:[6.85, -0.25], yaw:PI, yoff:-0.06, anim:'Draw', props:[['crayon', 'handR', [0, 0.02, 0.01], [PI/2, 0, 0]]] },
            text:'膝を抱えて描いた犬は、猫だそうだ。異論はない。' },
  bed:    { name:'寝かしつけ',   bubble:'とんとん中', kb:'おやすみ…', dur:11, hit:['f_kbed'], fx:'night',
            dad:{ spot:[8.9, -1.85], approach:[8.9, -1.35], yaw:PI, yoff:-0.18, anim:'Pat', props:[] },
            kid:{ spot:[8.75, -2.72], approach:[8.75, -2.05], yaw:-PI/2, yoff:0.45, anim:'Sleep', props:[] },
            text:'最後のもういっかいは寝言だった。明日も付き合う。' },
};
const HIT2ACT = {};
for (const [k, a] of Object.entries(ACTS)) for (const h of a.hit) HIT2ACT[h] = { solo:k };
for (const [k, a] of Object.entries(DUO)) for (const h of a.hit) HIT2ACT[h] = { duo:k };

/* ---------- 描画 ---------- */
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true, powerPreference:'high-performance' });
const pixRatio = () => Math.min(devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(pixRatio());
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.32;

/* 等角カメラ。目標は黄について部屋間を移動(x は 0.1〜7.16 のレール上) */
const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
const cam = { az:PI / 4, el:0.6, zoom:1, target:new THREE.Vector3(0.1, 0.7, 0.1), dist:34 };
const camGoal = { az:cam.az, el:cam.el, zoom:1, tx:0.1 };
const ROOM_A_X = 0.1, ROOM_B_X = 7.16;
function fitCamera() {
  const aspect = innerWidth / innerHeight;
  const h = Math.max(8.4, 11.2 / aspect) / cam.zoom;
  camera.top = h / 2; camera.bottom = -h / 2;
  camera.left = -h * aspect / 2; camera.right = h * aspect / 2;
  camera.updateProjectionMatrix();
}
function placeCamera() {
  const { az, el, dist, target } = cam;
  camera.position.set(target.x + dist * Math.cos(el) * Math.sin(az), target.y + dist * Math.sin(el), target.z + dist * Math.cos(el) * Math.cos(az));
  camera.lookAt(target);
}
fitCamera(); placeCamera();

/* ---------- 埋め込みの全景 ----------
   landing page では左に文章が載るので、家全体(2部屋)を右側の空きに収めた全景から始める。

    pos:new THREE.Vector3(), yaw:0, path:null, wp:0, speed, state:'idle', pending:null, settle:null, stepAcc:0,

    drop() { for (const p of a.held) p.parent?.remove(p); a.held.length = 0; },

  cam.az += (camGoal.az - cam.az) * (1 - Math.exp(-dt * 6));

  if (Math.abs(camGoal.zoom - cam.zoom) > 1e-4) { cam.zoom += (camGoal.zoom - cam.zoom) * (1 - Math.exp(-dt * 6)); fitCamera(); }
  placeCamera();

  if (!introDone) tickIntro(now);

  // 黄
  if (dad.state === 'enter') {
    if (introDone) {
      const d = ENTRY.clone().sub(dad.pos); const len = d.length();
      if (len < 0.03) { dad.state = 'wave'; S.waveT = 0; dad.yaw = PI / 4; dad.play('Wave', 0.2); sfx.blip(760, 0.08, 0.05); }
      else { d.normalize(); dad.pos.addScaledVector(d, Math.min(len, dad.speed * dt)); dad.yaw = Math.atan2(d.x, d.z); dad.stepAcc += dt; if (dad.stepAcc > 0.26) { dad.stepAcc = 0; sfx.step(); } }
    }
  } else if (dad.state === 'wave') {
    S.waveT += dt;
    if (S.waveT > 2.2) { dad.state = 'idle'; dad.play('Idle'); $('#bar').classList.add('on'); autoAt = now + 2.5; }
  } else if (dad.state === 'walk' || dad.state === 'settle') {
    stepAll(dad, dt, () => { if (dad.pending) { const f = dad.pending; dad.pending = null; f(); } else { dad.state = 'idle'; dad.play('Idle'); } });
  } else if (dad.state === 'act' && !S.duo) {
    const a = ACTS[S.act];
    setMeter(Math.min(100, S.actT / a.dur * 100));
    if (S.actT >= a.dur) { endAct(); autoAt = now + 1.5 + Math.random() * 2; }
  } else if (dad.state === 'idle' && !S.duo) {
    if (__room.auto && now - lastInput > AUTO_IDLE && now > autoAt) {
      const keys = [...Object.keys(ACTS), ...Object.keys(DUO), ...Object.keys(DUO)].filter(k => k !== S.lastAct);
      const k = keys[(Math.random() * keys.length) | 0];
      if (DUO[k]) startDuo(k); else startAct(k);
      autoAt = now + 60;
    }
  }
  // 息子
  if (kid.state === 'walk' || kid.state === 'settle') {
    stepAll(kid, dt, () => { if (kid.pending) { const f = kid.pending; kid.pending = null; f(); } else { kid.state = 'idle'; kid.play('Idle'); } });
  }
  tickKidAuto(dt);
  // 互动の進行
  if (S.duo) {
    const D = S.duo, d = DUO[D.key];
    if (!D.started) { if (D.dadReady && dad.state === 'ready' && dad.cur !== dad.clips.Idle) dad.play('Idle'); if (D.kidReady && kid.state === 'ready' && kid.cur !== kid.clips.Idle) kid.play('Idle'); if (D.dadReady && D.kidReady) beginDuo(); }
    else {
      setMeter(Math.min(100, D.t / d.dur * 100));
      if (D.t >= d.dur) { if (d.special === 'high') { if (D.phase !== 'down') { D.phase = 'down'; D.pt = 0; kid.play('Cheer', 0.2); } } else { endDuo(); autoAt = now + 2 + Math.random() * 2; } }
    }
  }
  dad.obj.position.copy(dad.pos); dad.obj.rotation.y = dad.yaw;
  kid.obj.position.copy(kid.pos); kid.obj.rotation.y = kid.yaw;
  dad.mixer.update(dt); kid.mixer.update(dt);
  tickFx(dt); tickHover(dt);

  if (bubble.classList.contains('on')) { const [x, y] = project(dad.bonePos('head', tmpV).add(new THREE.Vector3(0, 0.42, 0))); bubble.style.left = x + 'px'; bubble.style.top = y + 'px'; }
  if (kbubble.classList.contains('on')) { const [x, y] = project(kid.bonePos('head', tmpV).add(new THREE.Vector3(0, 0.36, 0))); kbubble.style.left = x + 'px'; kbubble.style.top = y + 'px'; }
  for (let i = ripples.length - 1; i >= 0; i--) { const r = ripples[i]; r.t += dt / 0.55; if (r.t >= 1) { scene.remove(r.m); r.m.material.dispose(); ripples.splice(i, 1); continue; } r.m.scale.setScalar(1 + r.t * 2.2); r.m.material.opacity = 0.9 * (1 - r.t); }

  renderer.render(scene, camera);
}
let wantAwake = !EMBED, introArmed = !EMBED;
function start() { if (running || !wantAwake) return; running = true; if (!introArmed) { introArmed = true; introStart = performance.now() / 1000; } clock.getDelta(); frame(); }
function sleep() { cancelAnimationFrame(raf); running = false; actx?.suspend?.(); sfx.hum(false); }
document.addEventListener('visibilitychange', () => { if (document.hidden) sleep(); else { actx?.resume?.(); start(); } });
addEventListener('message', e => {
  const d = e.data; if (!d || typeof d.type !== 'string') return;
  if (d.type === 'room:sleep') { wantAwake = false; sleep(); }
  if (d.type === 'room:wake') { wantAwake = true; actx?.resume?.(); start(); }
  if (d.type === 'room:layout') { copyFrac = +d.copyFrac || 0; fitWhole(); if (wholeMode) { camGoal.zoom = wholeZoom; cam.zoom = wholeZoom; cam.target.copy(wholeTarget); fitCamera(); placeCamera(); } }
});
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(pixRatio()); fitCamera(); if (EMBED) { fitWhole(); if (wholeMode) camGoal.zoom = wholeZoom; } });

$('#loader').classList.add('off');
$('#head').classList.add('on');
start();
// 覚えておいた合図を本来の受け口に流し直し、親にも準備できたと知らせる(親は配置と起きての合図を送り直す)
removeEventListener('message', onEarlyMsg);
for (const k of ['layout', 'awake']) if (earlyMsgs[k]) window.postMessage(earlyMsgs[k], '*');
if (EMBED) parent.postMessage({ type:'room:ready' }, '*');

// 検証用
function snap(w = 640) { renderer.render(scene, camera); const c = document.createElement('canvas'); c.width = w; c.height = Math.round(w * innerHeight / innerWidth); c.getContext('2d').drawImage(renderer.domElement, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.72); }
function view(tx, tz, az, el, zoom) { cam.target.set(tx, 0.7, tz); cam.az = camGoal.az = az; cam.el = camGoal.el = el; cam.zoom = camGoal.zoom = zoom; fitCamera(); placeCamera(); }
const __room = window.__room = { auto:true, snap, view, get running() { return running; }, S, dad, kid, ACTS, DUO, startAct, startDuo, endAct, endDuo, cam, camGoal, furn, emis, blocked, G, astar, nearestFree, divider, get introDone() { return introDone; } };
</script>
