<style>

  #stage { position:fixed; inset:0; }

  .back { position:fixed; top:clamp(18px, 3.5vh, 40px); left:clamp(18px, 2.5vw, 40px); z-index:9;

    color:#6f6d62; text-decoration:none; border:1px solid rgba(96,102,88,.3); border-radius:999px;

  .lbl { position:fixed; z-index:6; pointer-events:none; transform:translate(-50%,-50%);

  .lbl b { display:block; font:700 clamp(11px, 1.05vw, 16px)/1.4 "Hiragino Kaku Gothic ProN", sans-serif;

  .lbl i { display:block; font-style:normal; font:600 clamp(9px, .82vw, 12px)/1.4 "Helvetica Neue", sans-serif;

  .lbl.dim b { font-weight:600; color:#7f8a6b; font-size:clamp(9px, .8vw, 12px); letter-spacing:.14em; }

  .intro { position:fixed; right:clamp(16px, 2.6vw, 46px); top:50%; transform:translateY(-50%) translateX(40px);
    width:clamp(280px, 25vw, 380px); z-index:8; opacity:0; pointer-events:none;
    background:rgba(255,255,255,.72); border:1px solid rgba(96,102,88,.22); border-radius:18px;
    padding:clamp(20px, 1.8vw, 30px); backdrop-filter:blur(14px);
    transition: opacity .8s ease, transform .8s cubic-bezier(.22,.9,.3,1); }
  .intro.on { opacity:1; transform:translateY(-50%); pointer-events:auto; }
  .intro-label { font:600 clamp(9px, .8vw, 12px)/1 "Helvetica Neue", sans-serif; letter-spacing:.34em; color:#7f8a6b; }
  .intro p { margin:1.1em 0 0; color:#5a5a52;

  /* ── クイズ ──
     画面の使い方: 右に縦のパネル(問い・案A/B/C・答え合わせ)、左の残りに模型。
     模型は左の領域の中央に収め、演出中も結果表示中も隠れない。縦画面はパネルを下に置く */
  :root { --panel: clamp(360px, 30vw, 440px); --gap: 22px; }
  body.staging .lbl { opacity:0 !important; }
  body.staging .intro, body.verdicting .intro, body.quizzing .intro { opacity:0; pointer-events:none; }
  body.quizzing .head h1 { font-size:clamp(15px,1.3vw,20px); opacity:0; height:0; margin:0; overflow:hidden; }
  body.quizzing .head .eyebrow { opacity:.45; }

  .panel { position:fixed; z-index:20; right:var(--gap); top:var(--gap); bottom:var(--gap); width:var(--panel);
    display:flex; flex-direction:column; gap:12px; pointer-events:none; overflow:hidden; }
  .panel > * { pointer-events:auto; }
  .qhead { flex:none; opacity:0; transition:opacity .6s ease; padding:16px 18px 14px; border-radius:16px;
    background:rgba(255,255,255,.72); border:1px solid rgba(96,102,88,.2); backdrop-filter:blur(10px); text-align:left; }
  .qhead.on { opacity:1; }
  /* 出ていないときは場所も取らない(縦画面でパネルの高さから模型の領域を決めるため) */
  .qhead:not(.on), .cards:not(.on) { display:none; }

  .qhead b { display:block; margin-top:.6em; color:#4a4a43; letter-spacing:.02em;

  .cards { display:flex; flex-direction:column; gap:10px; opacity:0; transition:opacity .6s ease; pointer-events:none !important; min-height:0; }

  .facts { display:flex; gap:.5em; flex-wrap:wrap; margin-top:1em; }
  .facts span { padding:.42em .8em; border-radius:999px; border:1px solid rgba(96,102,88,.3);

  .vbtns { display:flex; gap:.6em; flex-wrap:wrap; margin-top:1.2em; }
  .vbtn { padding:.75em 1.5em; border-radius:999px; cursor:pointer; border:1px solid rgba(96,102,88,.3);

  .vbtn:hover { border-color:#7f8a6b; color:#4a4a43; }
  .vbtn.main { background:linear-gradient(180deg,#d7aa9c,#c48d7e); color:#ffffff; border-color:transparent; }

  /* 縦画面・狭い画面: パネルを下に、カードは横に3枚 */
  @media (max-width:860px), (max-aspect-ratio:1/1) {
    .panel { left:10px; right:10px; top:auto; bottom:10px; width:auto; max-height:54vh; gap:8px; }
    .qhead { padding:10px 12px 9px; border-radius:12px; }
    .qhead b { font-size:13px; margin-top:.4em; }
    .qdots { margin-top:.5em; } .qdots i { width:18px; }
    .cards { flex-direction:row; gap:6px; }
    .card { flex:1; min-width:0; flex-direction:column; border-radius:12px; }
    .card:hover { transform:none; }
    .card canvas { width:100%; }
    .card .txt { padding:.5em .6em .5em; }
    .card b { font-size:10px; } .card i { font-size:8.5px; line-height:1.35; }
    .card .pick { font-size:10px; }
    .card.sel .pick { max-height:38px; padding:.5em 0; }
    .verdict-box { padding:12px 14px; border-radius:14px; }

    .verdict-box h4 { font-size:13px; }
    .verdict-box p { font-size:11px; line-height:1.65; margin-top:.6em; }
    .facts { gap:.35em; margin-top:.7em; }
    .facts span { padding:.34em .6em; font-size:9px; }
    .vbtns { margin-top:.9em; gap:.4em; }

    .tick { gap:8px; padding:.45em .8em; } .tick .tk em { font-size:10px; }
  }
</style>

<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from '../assets/vendor/environments/RoomEnvironment.js';

/* ================================================================
   間取り図が立ち上がり、34階の夜景の上に現れる
   ---------------------------------------------------------------
   ① 方眼の上に線が引かれる(製図)
   ② 線から壁がせり上がり、床と家具が現れる
   ③ カメラが引くと、眼下に夜の街が広がっている ← 山場
   ④ 部屋の灯りが順に点き、物件概要が出る。以降はドラッグで見回せる
   平面座標は「メートル・原点は南西角・+yが北」。3Dへは (x, 0, -y)。
   ================================================================ */

/* ================================================================
   間取りのデータ。1件ぶんをこの形にまとめておけば、何件でも差し替えられる。
   x は東(右)、y は南(手前)。単位はメートル。
   ================================================================ */
// 家具 [x, y, 幅, 奥行, 高さ, 色, 角丸]
/* 家具の組み立て。箱1つでは家具に見えないので、部品を重ねて形を作る。
   返すのは既存と同じ [x, y, w, d, h, 色, 角丸, 持ち上げ] の配列なので、
   出現アニメーションなど後段はそのまま使える。
   x,y は手前左の角、w は x方向、d は y方向の寸法。 */
/* @@PURE-BEGIN plan */
const box = (x, y, w, d, h, c, r = .04, up = 0) => [x, y, w, d, h, c, r, up];

/* ソファ: 台座 + 背もたれ + 肘掛け + 座クッション + 背クッション。
   dir は背もたれのある向き('n'=y大きい側 / 's'=y小さい側) */
function sofa(x, y, w, d, dir, body, cush) {
  const BACK = .20, ARM = .17, SEAT_H = .30;
  const back = dir === 'n' ? y + d - BACK : y;
  const seatY = dir === 'n' ? y : y + BACK;
  const seatD = d - BACK;
  const out = [
    [x, y, w, d, SEAT_H, body, .06, 0, 'fab'],                        // 台座
    [x, back, w, BACK, .78, body, .07, 0, 'fab'],                     // 背もたれ
    [x, seatY, ARM, seatD, .56, body, .07, 0, 'fab'],                 // 肘掛け(左)
    [x + w - ARM, seatY, ARM, seatD, .56, body, .07, 0, 'fab'],       // 肘掛け(右)
  ];
  const n = w > 2.0 ? 3 : 2, cw = (w - ARM * 2 - .04) / n;
  for (let i = 0; i < n; i++) {
    out.push([x + ARM + .02 + i * cw, seatY + .04, cw - .03, seatD - .08, .17, cush, .06, SEAT_H, 'fab']);
    // 背クッションは少し内側に立てる
    out.push([x + ARM + .04 + i * cw, dir === 'n' ? back - .13 : back + BACK - .05,
              cw - .07, .18, .34, cush, .08, .46, 'fab']);
  }
  return out;
}

/* ダイニングテーブル: 天板 + 脚4本 */
function table(x, y, w, d, h, top, leg) {
  const T = .055, L = .07, o = .10;
  return [
    [x, y, w, d, T, top, .02, h - T, 'wood'],
    [x + o, y + o, L, L, h - T, leg, .01, 0, 'wood'],
    [x + w - o - L, y + o, L, L, h - T, leg, .01, 0, 'wood'],
    [x + o, y + d - o - L, L, L, h - T, leg, .01, 0, 'wood'],
    [x + w - o - L, y + d - o - L, L, L, h - T, leg, .01, 0, 'wood'],
  ];
}

/* 椅子: 座面 + 背 + 脚4本 */
function chair(x, y, dir, seat, leg) {
  const W = .44, D = .44, SH = .43, T = .05, L = .045;
  const bk = dir === 'n' ? y + D - .06 : y;
  return [
    [x, y, W, D, T, seat, .03, SH - T, 'fab'],
    [x + .03, bk, W - .06, .06, .44, seat, .03, SH, 'fab'],        // 背
    [x + .04, y + .04, L, L, SH - T, leg, .01, 0, 'wood'],
    [x + W - .04 - L, y + .04, L, L, SH - T, leg, .01, 0, 'wood'],
    [x + .04, y + D - .04 - L, L, L, SH - T, leg, .01, 0, 'wood'],
    [x + W - .04 - L, y + D - .04 - L, L, L, SH - T, leg, .01, 0, 'wood'],
  ];
}

/* ベッド: ヘッドボード + マットレス + 掛け布団 + 枕2つ。head は枕側 */
function bed(x, y, w, d, head, frame, duvet, pillow) {
  const HB = .09, MH = .46;
  const hbY = head === 'n' ? y + d - HB : y;
  const pilY = head === 'n' ? y + d - HB - .42 : y + HB + .06;
  const duvY = head === 'n' ? y : y + HB + .52;
  return [
    [x - .04, hbY, w + .08, HB, 1.02, frame, .03, 0, 'wood'],          // ヘッドボード
    [x, y, w, d, MH, frame, .05, 0, 'wood'],                           // マットレス台
    [x + .02, duvY, w - .04, d - HB - .52, .13, duvet, .07, MH, 'fab'],   // 掛け布団
    [x + .07, pilY, w / 2 - .12, .36, .15, pillow, .09, MH, 'fab'],
    [x + w / 2 + .05, pilY, w / 2 - .12, .36, .15, pillow, .09, MH, 'fab'],
  ];
}

/* テレビ: 台 + 画面 + 脚 */
function tv(x, y, w, d, dir, board, panel) {
  const BH = .40, SW = w * .74, SH = SW * .56;
  return [
    [x, y, w, d, BH, board, .04, 0, 'wood'],
    [x + (w - SW) / 2, y + d / 2 - .03, SW, .05, SH, panel, .01, BH + .10, 'tv'],
    [x + w / 2 - .14, y + d / 2 - .05, .28, .12, .10, C_DARK, .02, BH],
  ];
}

/* 観葉植物: 鉢 + 丸い葉の塊をいくつか重ねる */
function plant(x, y, s, pot, leaf1, leaf2) {
  const sph = (cx, cy, w, h, d, c, up) => [cx - w / 2, cy - d / 2, w, d, h, c, 0, up, 'sph'];
  const cx = x + s * .46, cy = y + s * .46;
  return [
    box(x, y, s * .92, s * .92, s * .70, pot, s * .26),          // 鉢
    box(x + s * .06, y + s * .06, s * .80, s * .80, s * .06, 0x2a2118, s * .22, s * .70),  // 土
    sph(cx, cy, s * 1.30, s * 1.05, s * 1.30, leaf1, s * .70),
    sph(cx - s * .30, cy + s * .22, s * .78, s * .66, s * .78, leaf2, s * 1.02),
    sph(cx + s * .26, cy - s * .18, s * .62, s * .56, s * .62, leaf2, s * 1.16),
  ];
}

/* 部屋ごとに色の家族を変える。全部が同じ青紫グレーだと、
   どの部屋も同じ顔になって「暮らし」が伝わらない。
   LDK=暖かい布と木 / 寝室=柔らかい寝具 / 水回り=冷たい白 */
const C_SOFA = 0x6b675f, C_CUSH = 0x8b857a;          // 布(グレージュ)
const C_WOODF = 0x8a6a44, C_WOODD = 0x6b5233;        // 木(明・暗)
const C_DARK = 0x26272f;                              // テレビ・家電
const C_RUG = 0x5c4433;                               // ラグ(テラコッタ)
const C_BED = 0x6d6152, C_DUVET = 0xcfc7b8, C_PILLOW = 0xe6e0d4;
const C_CHAIR = 0x7a736a, C_CHAIRL = 0x4a443c;        // 椅子(布+木脚)
const C_KIT = 0x3c414f;                               // キッチン
const C_WET = 0xccd4de, C_WET2 = 0xb9c3d0;            // 水回り
const C_GREEN = 0x4f7a49, C_GREEN2 = 0x5d8c50, C_POT = 0x33302a;

/* 開口の書式: [x1,y1,x2,y2, sw, f]
   sw … 開き戸の開く角度(±90)。無ければ引き戸か通り抜け
   f  … 文字で性質を足す。
        's' 引き戸/襖   'o' 最初から開いている   'l' 鍵が掛かる(開き戸だけ)
        'w' 掃き出し窓(視線は通る。出るのに0.8秒)   sw も f も無い = 建具なしの通り抜け */
function deriveDoors(gaps) {
  return gaps.map((g, i) => {
    const [x1, y1, x2, y2, sw, f = ''] = g;
    const w = Math.hypot(x2 - x1, y2 - y1);
    const ang = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
    let kind = 'open';
    if (f.includes('w')) kind = 'window';
    else if (f.includes('s')) kind = 'slide';
    else if (sw) kind = 'hinge';
    return { i, x1, y1, x2, y2, w, ang, sw: sw || 0, kind,
      open0: kind === 'open' || f.includes('o'),
      lock: kind === 'hinge' && f.includes('l'),
      mx: (x1 + x2) / 2, my: (y1 + y2) / 2 };
  });
}
/* 扉の記号(板+開く軌跡)を線分にする。引き戸は板だけ、窓は二重線 */
function doorLines(DOORS) {
  const out = [];
  for (const d of DOORS) {
    if (d.kind === 'open') continue;
    const a0 = d.ang * Math.PI / 180;
    if (d.kind === 'hinge') {
      const sw = d.sw * Math.PI / 180;
      out.push([d.x1, d.y1, d.x1 + Math.cos(a0 + sw) * d.w, d.y1 + Math.sin(a0 + sw) * d.w]);
      const n = 10;
      for (let i = 0; i < n; i++) {
        const t1 = a0 + sw * (i / n), t2 = a0 + sw * ((i + 1) / n);
        out.push([d.x1 + Math.cos(t1) * d.w, d.y1 + Math.sin(t1) * d.w, d.x1 + Math.cos(t2) * d.w, d.y1 + Math.sin(t2) * d.w]);
      }
    } else {
      const nx = -Math.sin(a0) * .05, ny = Math.cos(a0) * .05;
      out.push([d.x1 + nx, d.y1 + ny, d.x2 + nx, d.y2 + ny]);
      if (d.kind === 'window') out.push([d.x1 - nx, d.y1 - ny, d.x2 - nx, d.y2 - ny]);
    }
  }
  return out;
}

/* ================================================================
   間取りコンパイラ
   15件を手書きすると必ず破綻するので、「部屋の矩形」と「開口」だけ書けば
   壁・扉・寸法線・家具・照明が全部生成されるようにしてある。
   ・壁 = 全部屋の辺の和集合 から 開口を引いたもの
   ・家具 = 部屋の種別(ldk/bed/bath...)ごとの自動配置
   ================================================================ */
const EPS = 1e-6;

/* 同じ直線上の区間をまとめる */
function mergeSpans(spans) {
  spans.sort((a, b) => a[0] - b[0]);
  const out = [];
  for (const s of spans) {
    const last = out[out.length - 1];
    if (last && s[0] <= last[1] + EPS) last[1] = Math.max(last[1], s[1]);
    else out.push([s[0], s[1]]);
  }
  return out;
}
/* 区間から穴を引く */
function cutSpans(spans, holes) {
  let out = spans;
  for (const h of holes) {
    const next = [];
    for (const [a, b] of out) {
      if (h[1] <= a + EPS || h[0] >= b - EPS) { next.push([a, b]); continue; }
      if (h[0] > a + EPS) next.push([a, h[0]]);
      if (h[1] < b - EPS) next.push([h[1], b]);
    }
    out = next;
  }
  return out;
}

/* 部屋の矩形と開口から壁の線分を作る */
function deriveWalls(rooms, gaps) {
  const vLines = new Map(), hLines = new Map();   // 座標 → 区間の配列
  const push = (map, key, a, b) => {
    const k = key.toFixed(3);
    if (!map.has(k)) map.set(k, { c: key, sp: [] });
    map.get(k).sp.push([Math.min(a, b), Math.max(a, b)]);
  };
  for (const r of rooms) {
    if (r.out) continue;                          // バルコニーは壁を持たない
    push(hLines, r.y,        r.x, r.x + r.w);
    push(hLines, r.y + r.h,  r.x, r.x + r.w);
    push(vLines, r.x,        r.y, r.y + r.h);
    push(vLines, r.x + r.w,  r.y, r.y + r.h);
  }
  // 開口を線ごとに振り分ける
  const holeV = new Map(), holeH = new Map();
  for (const g of gaps) {
    const [x1, y1, x2, y2] = g;
    if (Math.abs(x1 - x2) < EPS) {                // 縦の開口
      const k = x1.toFixed(3);
      if (!holeV.has(k)) holeV.set(k, []);
      holeV.get(k).push([Math.min(y1, y2), Math.max(y1, y2)]);
    } else {
      const k = y1.toFixed(3);
      if (!holeH.has(k)) holeH.set(k, []);
      holeH.get(k).push([Math.min(x1, x2), Math.max(x1, x2)]);
    }
  }
  const out = [];
  for (const [k, v] of hLines) {
    const spans = cutSpans(mergeSpans(v.sp), holeH.get(k) || []);
    for (const [a, b] of spans) if (b - a > .02) out.push([a, v.c, b, v.c]);
  }
  for (const [k, v] of vLines) {
    const spans = cutSpans(mergeSpans(v.sp), holeV.get(k) || []);
    for (const [a, b] of spans) if (b - a > .02) out.push([v.c, a, v.c, b]);
  }
  return out;
}

/* ── 家具の自動配置 ──
   部屋の種別と向き(縦長/横長)から、それらしい配置を決める。
   手で15部屋ぶん置くのは無理なので、ここで質を担保する。 */
function autoFurn(rooms, plan) {
  const F = [];
  const inset = (r, m) => ({ x: r.x + m, y: r.y + m, w: r.w - m * 2, h: r.h - m * 2 });
  for (const r of rooms) {
    const wide = r.w >= r.h;
    if (r.t === 'ldk') {
      const a = inset(r, .35);
      // ソファ+ローテーブル+テレビ を短辺方向に並べる
      const sw = Math.min(2.5, a.w * .62), sd = 1.05;
      const sx = a.x + (a.w - sw) / 2;
      const sy = a.y + a.h * .06;
      F.push(...sofa(sx, sy, sw, sd, 's', C_SOFA, C_CUSH));
      F.push([sx + sw * .1, sy + sd + .30, sw * .8, Math.min(1.7, a.h * .30), .026, C_RUG, .34, 0, 'fab']);   // ラグ
      F.push(...table(sx + sw * .22, sy + sd + .55, sw * .56, .68, .40, C_WOODD, 0x54402a));
      const tvy = Math.min(a.y + a.h - .5, sy + sd + 1.5);
      F.push(...tv(sx + sw * .02, tvy, sw * .96, .46, 'n', C_WOODD, 0x121319));
      // ダイニング(部屋の残りの側)
      if (a.w > 5.4) {
        const dx = a.x + a.w - 2.6;
        F.push(...table(dx, a.y + a.h * .25, 1.7, 1.0, .72, C_WOODF, 0x63503c));
        F.push(...chair(dx + .12, a.y + a.h * .25 - .55, 's', C_CHAIR, C_CHAIRL));
        F.push(...chair(dx + .80, a.y + a.h * .25 - .55, 's', C_CHAIR, C_CHAIRL));
        F.push(...chair(dx + .12, a.y + a.h * .25 + 1.09, 'n', C_CHAIR, C_CHAIRL));
        F.push(...chair(dx + .80, a.y + a.h * .25 + 1.09, 'n', C_CHAIR, C_CHAIRL));
        F.push([a.x + a.w - 3.0, a.y + a.h - .70, 2.9, .66, .90, C_KIT, .04, 0, 'wet']);   // キッチン
        F.push(...plant(a.x + a.w - .75, a.y + .15, .58, C_POT, C_GREEN, C_GREEN2));
      } else {
        F.push(...table(a.x + a.w - 1.9, a.y + a.h - 1.5, 1.4, .85, .72, C_WOODF, 0x63503c));
        F.push([a.x + .1, a.y + a.h - .68, Math.min(2.4, a.w - .3), .62, .88, C_KIT, .04, 0, 'wet']);
        F.push(...plant(a.x + a.w - .70, a.y + .12, .50, C_POT, C_GREEN, C_GREEN2));
      }
    } else if (r.t === 'bed') {
      const a = inset(r, .30);
      const bw = Math.min(a.w * .74, r.w > 3.2 ? 2.2 : 1.5), bd = Math.min(a.h * .82, 2.10);
      F.push(...bed(a.x + (a.w - bw) / 2, a.y + a.h - bd, bw, bd, 'n', C_BED, C_DUVET, C_PILLOW));
      F.push([a.x + a.w - .55, a.y, .5, .5, .40, C_WOODD, .10, 0, 'wood']);   // サイドテーブル
      if (a.w > 3.0) F.push([a.x, a.y, 1.2, .55, .70, C_WOODD, .04, 0, 'wood']);    // デスク
      if (a.h > 2.9) F.push(...plant(a.x + .06, a.y + .06, .44, C_POT, C_GREEN, C_GREEN2));
    } else if (r.t === 'bath') {
      F.push([r.x + .18, r.y + .18, r.w - .36, Math.min(.85, r.h - .5), .55, C_WET, .14, 0, 'wet']);
    } else if (r.t === 'wash') {
      F.push([r.x + .16, r.y + r.h - .68, r.w - .32, .5, .82, C_WET2, .05, 0, 'wet']);
      F.push([r.x + .3, r.y + .18, r.w - .6, .06, .70, 0xb8cadf, .04, .95, 'wet']);   // 鏡
    } else if (r.t === 'wc') {
      // 'wc' は納戸・書斎・WIC・前室にも使っている。名前で中身を変える
      if (r.n === 'トイレ') {
        F.push([r.x + r.w / 2 - .22, r.y + .2, .45, .62, .42, C_WET, .12, 0, 'wet']);
      } else if (r.n === '書斎') {
        F.push([r.x + .18, r.y + r.h - .74, Math.min(1.7, r.w - .36), .56, .72, C_WOODD, .03, 0, 'wood']);
        F.push(...chair(r.x + .5, r.y + r.h - 1.5, 'n', C_CHAIR, C_CHAIRL));
        F.push([r.x + r.w - .5, r.y + .2, .34, .34, 1.5, C_WOODD, .02, 0, 'wood']);
      } else {
        // 納戸・WIC・前室: 壁づけの棚
        const d2 = Math.min(.42, r.w * .3);
        F.push([r.x + .1, r.y + .12, d2, r.h - .24, 1.85, C_WOODD, .02, 0, 'wood']);
        if (r.w > 1.5) F.push([r.x + r.w - .1 - d2, r.y + .12, d2, r.h - .24, 1.85, C_WOODD, .02, 0, 'wood']);
      }
    } else if (r.t === 'ent') {
      F.push([r.x + .12, r.y + r.h - .5, r.w - .24, .38, 1.05, C_WOODD, .04, 0, 'wood']);  // 靴箱
    } else if (r.t === 'bal') {
      F.push([r.x + r.w * .12, r.y + r.h * .3, .5, .5, .40, C_CHAIRL, .10, 0, 'wood']);
      F.push([r.x + r.w * .12 + .9, r.y + r.h * .3, .5, .5, .40, C_CHAIRL, .10, 0, 'wood']);
    }
  }
  return F;
}

/* 照明も部屋ごとに自動 */
function autoLamps(rooms) {
  const L = [];
  for (const r of rooms) {
    if (r.out) continue;
    const c = r.t === 'ldk' ? 0xffd9a0 : r.t === 'bed' ? 0xffc98a : 0xd8ecff;
    const i = r.t === 'ldk' ? 32 : r.t === 'bed' ? 17 : 8;
    L.push([r.x + r.w / 2, r.y + r.h / 2, 2.3, c, i]);
  }
  return L;
}

/* 間取り全体(部屋・庭・出口)の範囲 */
function planBounds(plan) {
  let x0 = 0, y0 = 0, x1 = plan.W, y1 = plan.D;
  for (const r of plan.ROOMS) { x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y); x1 = Math.max(x1, r.x + r.w); y1 = Math.max(y1, r.y + r.h); }
  for (const e of (plan.EXITS || [])) { x0 = Math.min(x0, e.x - .3); y0 = Math.min(y0, e.y - .3); x1 = Math.max(x1, e.x + .3); y1 = Math.max(y1, e.y + .3); }
  return { x0, y0, x1, y1 };
}
/* ベッドの位置(autoFurn と同じ置き方)。住人はここで寝ている */
function bedSpot(r) {
  const a = { x: r.x + .30, y: r.y + .30, w: r.w - .60, h: r.h - .60 };
  const bw = Math.min(a.w * .74, r.w > 3.2 ? 2.2 : 1.5), bd = Math.min(a.h * .82, 2.10);
  return [a.x + (a.w - bw) / 2 + bw / 2, a.y + a.h - bd + bd / 2];
}
/* 定義から実際に使う形へ */
function makePlan(def) {
  const rooms = def.rooms;
  // resident は部屋名(そのベッドで寝ている)か [x,y]
  const resident = typeof def.resident === 'string'
    ? bedSpot(rooms.find(r => r.n === def.resident) || rooms.find(r => r.t === 'bed'))
    : def.resident;
  const WALLS = deriveWalls(rooms, def.gaps || []);
  const outs = rooms.filter(r => r.out);
  const BALCONY = [];
  for (const b of outs) {
    // 手すりの線。住戸に接している辺は引かない
    const edges = [[b.x, b.y + b.h, b.x, b.y], [b.x, b.y, b.x + b.w, b.y], [b.x + b.w, b.y, b.x + b.w, b.y + b.h], [b.x + b.w, b.y + b.h, b.x, b.y + b.h]];
    for (const e of edges) {
      const mx = (e[0] + e[2]) / 2, my = (e[1] + e[3]) / 2;
      const touch = rooms.some(r => !r.out && mx >= r.x - .02 && mx <= r.x + r.w + .02 && my >= r.y - .02 && my <= r.y + r.h + .02);
      if (!touch) BALCONY.push([...e, (b.n.includes('庭') || b.n.includes('テラス') || b.n.includes('ヤード')) ? 'g' : 'b']);
    }
  }
  const south = outs.filter(r => r.y < 0);
  const padS = south.length ? Math.max(...south.map(r => -r.y)) : 0;
  const DOORS = deriveDoors(def.gaps || []);
  /* 鍵の掛かる扉は「どちら側から掛けるか」を決めておく。
     居室・水回りの側(内側)に入ったときだけ掛けられる。廊下側からは掛けられない */
  for (const d of DOORS) {
    if (!d.lock) continue;
    const on = r => !r.out && (
      (Math.abs(d.mx - r.x) < .02 || Math.abs(d.mx - (r.x + r.w)) < .02) && d.my > r.y - .02 && d.my < r.y + r.h + .02 ||
      (Math.abs(d.my - r.y) < .02 || Math.abs(d.my - (r.y + r.h)) < .02) && d.mx > r.x - .02 && d.mx < r.x + r.w + .02);
    const adj = rooms.filter(on);
    d.lockRoom = adj.find(r => r.t === 'bed') || adj.find(r => r.t !== 'hall' && r.t !== 'ent' && r.t !== 'ldk') || null;
  }
  return Object.assign({}, def, {
    WALLS, BALCONY, resident,
    DOORS,
    WINDOWS: def.windows || [],
    ROOMS: rooms,
    EXITS: (def.exits || []).map(e => Object.assign({}, e)),
    DIMS: [{ t: (def.W * 1000).toFixed(0), x: def.W / 2, y: -(padS + 1.0) },
           { t: (def.D * 1000).toFixed(0), x: -1.5, y: def.D / 2 }],
    FURN: autoFurn(rooms, def),
    LAMPS: autoLamps(rooms),
  });
}

const PLANS = DEFS.map(makePlan);

let W = PLAN.W, D = PLAN.D, CX = W / 2, CY = D / 2 - .4;
const WALL_H = 2.55, WALL_T = 0.16;

/* ── 描画基盤 ── */
const canvas = document.getElementById('stage');

renderer.setClearColor(0xf1eee6, 1);   // 昼: 空は紙の色
/* 倍率の上限だけでは大きな窓で効かないので、総画素数にも上限を設ける */
const pixRatio = () => {
  let pr = Math.min(devicePixelRatio || 1, 1.5);
  const px = innerWidth * innerHeight * pr * pr;
  return px > 5.2e6 ? pr * Math.sqrt(5.2e6 / px) : pr;
};
renderer.setPixelRatio(pixRatio());
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;   // r185でPCFSoftは廃止(警告が出て実際は効かない)
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xf1eee6, .0030);   // 昼: 紙の色へ溶ける
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 1400);
const root = new THREE.Group();
scene.add(root);
const P = (x, y, h = 0) => new THREE.Vector3(x - CX, h, -(y - CY));

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), .04).texture;
scene.environmentIntensity = .20;

const moon = new THREE.DirectionalLight(0xfff4e2, 2.1);   // 昼の太陽(名前は据え置き)

moon.castShadow = true;
moon.shadow.mapSize.set(3072, 3072);

moon.shadow.camera.top = 12; moon.shadow.camera.bottom = -12;
moon.shadow.camera.near = 4; moon.shadow.camera.far = 70;
moon.shadow.bias = -.0002; moon.shadow.normalBias = .07;   // 壁の上面に出ていた黒い欠けを潰す
scene.add(moon);
scene.add(new THREE.AmbientLight(0xe4e6dc, .55));

/* ── 眼下の夜の街 ──
   窓明かりを描いたテクスチャを貼った箱を1500棟。霧で地平へ溶かす。 */
const FLOOR_Y = -150;                                  // 眼下。冒頭の引きの画でだけ見せる                                  // 眼下。深く取らないと「見下ろしている」感じが出ない
function windowTex(seed) {
  const c = document.createElement('canvas');
  c.width = 128; c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#d9d6cb'; g.fillRect(0, 0, 128, 256);
  const cols = 16, rows = 64;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    if (Math.random() > .38) continue;
    const warm = Math.random();
    g.fillStyle = warm > .82 ? '#dcecff' : warm > .38 ? '#ffdcaa' : '#ffc275';
    g.globalAlpha = .4 + Math.random() * .6;
    g.fillRect(x * 8 + 2.4, y * 4 + 1.2, 3.4, 1.9);
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
/* 窓の柄を3種類に分けて建てる。1種類だと全棟が同じ模様になって繰り返しが見えてしまう */
const cityMeshes = [];
for (let g = 0; g < 3; g++) {
  const N = 950;
  const im = new THREE.InstancedMesh(
    new THREE.BoxGeometry(1, 1, 1),
    new THREE.MeshStandardMaterial({
      color: 0xe0ddd2, roughness: .9, metalness: .02,
      emissive: 0xffffff, emissiveMap: windowTex(g), emissiveIntensity: .06,
      transparent: true, opacity: 0,
    }), N);
  const m = new THREE.Object3D();
  const col = new THREE.Color();
  for (let k = 0; k < N; k++) {
    const a = Math.random() * Math.PI * 2;
    const r = 55 + Math.pow(Math.random(), .55) * 520;
    const near = 1 - Math.min(1, r / 520);
    const h = (14 + Math.random() * 52) * (.5 + near * .9);
    m.position.set(Math.cos(a) * r, FLOOR_Y + h / 2, Math.sin(a) * r);
    m.scale.set(7 + Math.random() * 15, h, 7 + Math.random() * 15);
    m.rotation.y = Math.random() * .7;
    m.updateMatrix();
    im.setMatrixAt(k, m.matrix);
    const v = .72 + Math.random() * .5;
    im.setColorAt(k, col.setRGB(v * .95, v * .96, v));
  }
  im.instanceMatrix.needsUpdate = true;
  im.visible = false;
  if (im.instanceColor) im.instanceColor.needsUpdate = true;
  scene.add(im);
  cityMeshes.push(im);
}

/* ── ① 引かれていく線 ──
   WebGLは線の太さを指定できないので、線分ごとに細長い板を作る。
   各頂点に「図面の何メートル目か」を持たせ、uReveal を伸ばすと
   そこまでが現れる。1本の uniform だけで製図の進行を表せる。 */
function buildLines(list, color, half) {
  const pos = [], dist = [], idx = [];
  let acc = 0, v = 0;
  for (const [x1, y1, x2, y2] of list) {
    const a = P(x1, y1), b = P(x2, y2);
    const len = a.distanceTo(b);
    const dx = (b.x - a.x) / len, dz = (b.z - a.z) / len;
    const px = -dz * half, pz = dx * half;
    const ex = dx * half, ez = dz * half;             // 端を少し伸ばして角を繋ぐ
    pos.push(a.x - ex + px, 0, a.z - ez + pz,  a.x - ex - px, 0, a.z - ez - pz,
             b.x + ex + px, 0, b.z + ez + pz,  b.x + ex - px, 0, b.z + ez - pz);
    dist.push(acc, acc, acc + len, acc + len);
    idx.push(v, v + 1, v + 2, v + 1, v + 3, v + 2);
    v += 4; acc += len;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('aDist', new THREE.Float32BufferAttribute(dist, 1));
  g.setIndex(idx);
  const m = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, side: THREE.DoubleSide,
    blending: THREE.NormalBlending, fog: false,
    uniforms: { uReveal: { value: 0 }, uCol: { value: new THREE.Color(color) }, uOp: { value: 1 } },
    vertexShader: `attribute float aDist; varying float vD;
      void main(){ vD = aDist; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
    fragmentShader: `varying float vD; uniform float uReveal; uniform vec3 uCol; uniform float uOp;
      void main(){
        if (vD > uReveal) discard;
        float tip = 1. - smoothstep(0., 1.4, uReveal - vD);   // 先端が少し明るい
        gl_FragColor = vec4(mix(uCol, vec3(1.), tip * .5), uOp);
      }`,
  });
  const mesh = new THREE.Mesh(g, m);
  mesh.position.y = .012;
  mesh.userData.total = acc;
  root.add(mesh);
  return mesh;
}

/* ── 物件を差し替えても作り直さないもの(材質・テクスチャ・共有ジオメトリ) ── */

   上面だけ暗くして輪郭を立たせる */

const matCap = new THREE.MeshStandardMaterial({ color: 0x8d9280, roughness: .75, metalness: .04 });
/* 床は単色だと模型に見える。板と目地をその場で描いて本物の床にする。
   1枚のテクスチャを作って、部屋ごとに繰り返し回数だけ変える(板幅を揃えるため) */
function woodTex(px = 1024, span = 2.4) {   // span = このテクスチャが覆う実寸(m)
  const c = document.createElement('canvas'); c.width = c.height = px;
  const g = c.getContext('2d');
  const PLANK = 0.19;                        // 板1枚の幅(m)
  const rows = Math.round(span / PLANK);
  const h = px / rows;
  let seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  g.fillStyle = '#8a6a4a'; g.fillRect(0, 0, px, px);
  for (let i = 0; i < rows; i++) {
    const y = i * h;
    // 板ごとに色みを少しずらす。これが無いと「1枚の板」に見えてしまう
    const t = rnd(), L = 0.86 + t * 0.28;
    g.fillStyle = `rgb(${Math.round(138*L)},${Math.round(106*L*0.98)},${Math.round(74*L*0.95)})`;
    g.fillRect(0, y, px, h);
    // 木目
    g.strokeStyle = 'rgba(60,38,22,.13)'; g.lineWidth = 1;
    for (let k = 0; k < 7; k++) {
      const yy = y + h * (0.12 + rnd() * 0.76);
      g.beginPath(); g.moveTo(0, yy);
      for (let x = 0; x <= px; x += 48) g.lineTo(x, yy + Math.sin(x * .012 + k) * h * .05);
      g.stroke();
    }
    // 板の継ぎ目(横)
    const cut = Math.round(px * (0.2 + rnd() * 0.6));
    g.strokeStyle = 'rgba(48,30,18,.42)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(cut, y); g.lineTo(cut, y + h); g.stroke();
    // 目地(縦方向の板間)
    g.strokeStyle = 'rgba(44,28,16,.5)'; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, y); g.lineTo(px, y); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
function tileTex(px = 512, span = 1.8) {     // 水回り: 大判タイル
  const c = document.createElement('canvas'); c.width = c.height = px;
  const g = c.getContext('2d');
  const n = 3, s = px / n;
  let seed = 19;
  const rnd = () => (seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
    const L = 0.94 + rnd() * 0.1;
    g.fillStyle = `rgb(${Math.round(185*L)},${Math.round(194*L)},${Math.round(214*L)})`;
    g.fillRect(i * s, j * s, s, s);
  }
  g.strokeStyle = 'rgba(120,128,150,.55)'; g.lineWidth = 2;
  for (let i = 0; i <= n; i++) {
    g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, px); g.stroke();
    g.beginPath(); g.moveTo(0, i * s); g.lineTo(px, i * s); g.stroke();
  }
  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return tex;
}
const WOOD_SPAN = 2.4, TILE_SPAN = 1.8;
const woodBase = woodTex(1024, WOOD_SPAN), tileBase = tileTex(512, TILE_SPAN);

// 角の丸い箱(家具は角が丸いだけで一気に本物らしくなる)
function roundBox(w, d, h, r) {
  r = Math.min(r, w / 2 - .01, d / 2 - .01);
  const sh = new THREE.Shape();
  sh.moveTo(-w / 2 + r, -d / 2);
  sh.lineTo(w / 2 - r, -d / 2); sh.quadraticCurveTo(w / 2, -d / 2, w / 2, -d / 2 + r);
  sh.lineTo(w / 2, d / 2 - r);  sh.quadraticCurveTo(w / 2, d / 2, w / 2 - r, d / 2);
  sh.lineTo(-w / 2 + r, d / 2); sh.quadraticCurveTo(-w / 2, d / 2, -w / 2, d / 2 - r);
  sh.lineTo(-w / 2, -d / 2 + r); sh.quadraticCurveTo(-w / 2, -d / 2, -w / 2 + r, -d / 2);
  const bev = Math.min(.03, h / 3);
  const g = new THREE.ExtrudeGeometry(sh, { depth: Math.max(.01, h - bev * 2),
    bevelEnabled: true, bevelSize: bev, bevelThickness: bev, bevelSegments: 2, curveSegments: 6 });
  g.rotateX(-Math.PI / 2);
  // 回転後のyは [-bev, h-bev]。bevだけ持ち上げれば足元が0になる。
  // ここを h-bev にしていたため、家具が全部 h ぶん浮いていた。
  g.translate(0, bev, 0);
  return g;
}

/* 前の物件を捨てる。ジオメトリとラベルのDOMを必ず解放する */
function clearPlan() {

  lineWall.material.uniforms.uOp.value = 1 - ease(rise) * .85;
  lineBal.material.uniforms.uOp.value = 1 - ease(rise) * .85;
  lineDoor.material.uniforms.uOp.value = 1 - ease(rise) * .92;
  lineWin.material.uniforms.uOp.value = 1 - ease(rise) * .92;

  for (const w of walls) {
    const k = ease(clamp((rise - w.at * .42) / .58));
    w.m.visible = k > .002;
    w.m.scale.y = Math.max(.0001, k);
    if (w.cap) w.m.position.y = w.cap * k;    // 笠木は壁の頭に付いて上がる
  }
  const fl = ease(seg(t, T.floor));
  for (const f of floors) f.material.opacity = fl;
  slab.visible = fl > .02;

  const fu = seg(t, T.furn);
  furn.forEach((m, i) => {
    const k = ease(clamp((fu - (i / furn.length) * .55) / .45));
    m.visible = k > .01;
    m.scale.setScalar(Math.max(.001, k));
  });

  const lp = seg(t, T.lamp);
  lamps.forEach((o, i) => {
    const k = clamp((lp - (i / lamps.length) * .7) / .3);
    o.l.intensity = o.max * ease(k) * (.93 + Math.sin(now / 900 + i) * .04);
  });
  moon.intensity = 1.5 - ease(lp) * .5;

  // 街は引きの瞬間に立ち上がる(製図中に見えていると台無しになる)
  /* 街は冒頭の引きの画でだけ見せる。俯瞰にすると同じ大きさの箱が並んで
     「見下ろしている」感覚が壊れるので、クイズ中は消す */
  cityMix += ((quizCam ? 0 : 1) - cityMix) * .06;
  const cityFade = ease(seg(t, [8.4, 11.6])) * cityMix;
  for (const im of cityMeshes) { im.visible = cityFade > .01; im.material.opacity = cityFade; }
  halo.material.uniforms.uOp.value = (1 - cityMix) * ease(clamp((t - 5.6) / 2.4));
  ground.visible = cityFade > .01; ground.material.opacity = cityFade;

  if (quizCam) fitQuizCam(); else camAt(t);
  if (!dragging) spin *= .955;
  orbit += spin * .05;
  // 画面が縦長だと横の画角が狭まって隅しか映らない。比率に応じて引く
  const asp = camera.aspect;
  // 俯瞰カメラは自分で比率を考慮して距離を出しているので、ここでは引かない
  const back = quizCam ? 1 : (asp >= 1.6 ? 1 : asp >= 1 ? 1 + (1.6 - asp) * .42 : 1.25 + (1 - asp) * 1.25);
  const r = Math.hypot(camP.x, camP.z) * back, a = Math.atan2(camP.x, camP.z) + orbit;
  if (!window.__camLock) camera.position.set(Math.sin(a) * r, camL.y + (camP.y - camL.y) * back, Math.cos(a) * r);
  // 下にカードが並ぶぶん、間取りを画面の上寄りに置く。
  // 縦画面はさらに概要パネルも出るので余分に上げる
  const lift = quizCam ? 0 : (asp < 1 ? (1 - asp) * 3.2 : 0);
  if (!window.__camLock) camera.lookAt(camL.x, camL.y - lift, camL.z);   // 検証用にカメラを止められるように

  if (t > 1.4) document.getElementById('head').classList.add('on');
  if (t > T.spec && !introDone) document.getElementById('intro').classList.add('on');
  // 引きの画では部屋名が邪魔なので消す
  const shown = t > T.label ? 1 : 0;
  const dimFade = 1 - ease(seg(t, T.rise));      // 寸法は製図の道具なので壁が立ったら消す
  const far = quizCam ? 0 : clamp((camera.position.distanceTo(camL) - 19) / 8);
  for (const l of labels) {
    const v = l.v.clone().project(camera);
    l.el.style.left = (v.x * .5 + .5) * innerWidth + 'px';
    l.el.style.top = (-v.y * .5 + .5) * innerHeight + 'px';
    l.el.style.opacity = (v.z < 1 ? (1 - far) : 0) * (dimEls.includes(l) ? dimFade : shown);
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

addEventListener('resize', () => {
  renderer.setPixelRatio(pixRatio());   // 窓の大きさで上限が変わるので取り直す
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
});

/* ================================================================
   クイズ本体
   5問 × 3案。「一番いいのはどれ?」とだけ聞く。基準は伏せておいて、
   答え合わせで侵入の演出を流す。侵入が失敗した1つが正解。
   ================================================================ */
const GROUPS = [1, 2, 3, 4, 5].map(q => PLANS.filter(p => p.q === q));
/* 問いの文言。テーマ(見る観点)を1つずつ足していき、最後は全部 */
const QUIZ = [
  { theme: '見通し', q: '夜中、玄関から侵入者が入ってきた。寝ている場所が、いちばん見つかりにくいのは？' },
  { theme: '建具',   q: '襖か、引き戸か、鍵の掛かる扉か。侵入者の足を、いちばん止めるのは？' },
  { theme: '逃げ道', q: '1階の庭付き。外へ、いちばん早く逃げ切れるのは？' },
  { theme: '距離',   q: '3LDKの廊下の型。玄関から寝床が遠くて、いちばん逃げやすいのは？' },
  { theme: '総合',   q: '見通し・建具・逃げ道・距離。全部ふまえて、いちばん安全なのは？' },
];
/* 採点。正解数で安全意識を評価する。笑えるくらいがちょうどいい */
const RANK = [
  { s: 5, title: '安全意識: FBIレベル', text: '全問正解。これからの住居選びは絶対に心配なし。というより、次の内見は黄のほうが同行をお願いしたい。' },
  { s: 4, title: '安全意識: 警備会社の隊長レベル', text: '1問だけ油断した。侵入者は、その1問から入ってくる。でもほぼ合格。世界一安全な家、一緒に建てられる。' },
  { s: 3, title: '安全意識: 町内会の防犯部長レベル', text: '半分は見えている。残りの半分は、内見のとき黄が横で「その扉、鍵は掛かりますか」と聞く係をやる。' },
  { s: 2, title: '安全意識: 戸締まりは忘れない人レベル', text: '鍵は掛ける。でも間取りは見ていない。鍵より先に見るのは、扉の位置と寝床までの距離。次はそこから。' },
  { s: 1, title: '安全意識: 南向き・駅近で決める人レベル', text: '日当たりは気持ちいい。でも日当たりは命を守らない。逃げ道は守る。まずは寝室の窓から外に出られるか、それだけ見よう。' },
  { s: 0, title: '安全意識: 侵入者と目が合うレベル', text: '玄関を開けた瞬間に見つかる家を、5回連続で選んだ。逆にすごい。世界一安全な家は黄が作るので、あなたは鍵だけ掛けてください。' },
];
let results = [];          // 問ごとの ○×
let introDone = false;
/* 各問の正解 = 計算で一番余裕があった間取り。手で決めた正解は使わない */
for (const g of GROUPS) {
  const rs = g.map(p => simulate(p));
  let bi = 0; rs.forEach((r, i) => { if (r.margin > rs[bi].margin) bi = i; });
  g.forEach((p, i) => { p.safe = i === bi; p.margin = rs[i].margin; p.outcome = rs[i].reason; });
}
let qi = 0, picked = null, score = 0, revealing = false;

/* カード用の小さな平面図。3Dだけだと3案の違いが一目で掴めない */
function planThumb(plan, w = 236, h = 176) {
  const c = document.createElement('canvas');
  c.width = w * 2; c.height = h * 2;
  const g = c.getContext('2d');
  g.scale(2, 2);
  g.fillStyle = '#f3f0e8'; g.fillRect(0, 0, w, h);
  const pad = 13, B = planBounds(plan);
  const bw = B.x1 - B.x0, bh = B.y1 - B.y0;
  const sc = Math.min((w - pad * 2) / bw, (h - pad * 2) / bh);
  const X = x => pad + (w - pad * 2 - bw * sc) / 2 + (x - B.x0) * sc;
  const Y = y => h - pad - (y - B.y0) * sc - (h - pad * 2 - bh * sc) / 2;
  /* 部屋を用途で塗り分ける。壁線だけだと3案の違いが判断できない */
  const FILL = { ldk: '#efe4cf', bed: '#e6e3ee', bath: '#dfe8ec', wash: '#dfe8ec',
                 wc: '#e9e6df', ent: '#ebdad3', hall: '#eeebe3' };
  for (const r of plan.ROOMS) {
    g.fillStyle = r.out ? (r.n.includes('庭') || r.n.includes('テラス') ? '#dbe6d0' : '#e3e7ea') : (FILL[r.t] || '#eae8e0');
    g.fillRect(X(r.x), Y(r.y + r.h), r.w * sc, r.h * sc);
  }
  g.strokeStyle = '#5c5f52'; g.lineWidth = 2.4; g.lineCap = 'round';
  for (const [x1, y1, x2, y2] of plan.WALLS) {
    g.beginPath(); g.moveTo(X(x1), Y(y1)); g.lineTo(X(x2), Y(y2)); g.stroke();
  }
  /* 建具。開き戸は弧、引き戸は二重線、窓は水色、鍵の掛かる扉は金の点 */
  for (const d of plan.DOORS) {
    if (d.kind === 'open') continue;
    const a0 = d.ang * Math.PI / 180;
    const px = X(d.x1), py = Y(d.y1), qx = X(d.x2), qy = Y(d.y2);
    if (d.kind === 'hinge') {
      const sw = d.sw * Math.PI / 180;
      g.strokeStyle = '#8a9479'; g.lineWidth = 1.1;
      g.beginPath(); g.arc(px, py, d.w * sc, -a0, -(a0 + sw), sw > 0); g.stroke();
      g.beginPath(); g.moveTo(px, py); g.lineTo(X(d.x1 + Math.cos(a0 + sw) * d.w), Y(d.y1 + Math.sin(a0 + sw) * d.w)); g.stroke();
      if (d.lock) { g.fillStyle = '#c48d7e'; g.beginPath(); g.arc(X(d.mx), Y(d.my), 2.8, 0, 7); g.fill();
        g.strokeStyle = '#000'; g.lineWidth = .8; g.stroke(); }
    } else if (d.kind === 'slide') {
      const dx = qx - px, dy = qy - py, L = Math.hypot(dx, dy) || 1, ox = -dy / L * 1.5, oy = dx / L * 1.5;
      g.strokeStyle = '#8a9479'; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(px + ox, py + oy); g.lineTo(px + dx * .55 + ox, py + dy * .55 + oy); g.stroke();
      g.beginPath(); g.moveTo(px + dx * .45 - ox, py + dy * .45 - oy); g.lineTo(qx - ox, qy - oy); g.stroke();
    } else {
      g.strokeStyle = '#7fb2c9'; g.lineWidth = 2.2;
      g.beginPath(); g.moveTo(px, py); g.lineTo(qx, qy); g.stroke();
    }
  }
  /* 出口(金)と名前 */
  g.font = '700 8px "Hiragino Kaku Gothic ProN", sans-serif';
  for (const e of plan.EXITS) {
    const ex = X(e.x), ey = Y(e.y);
    g.fillStyle = '#c48d7e'; g.beginPath(); g.arc(ex, ey, 3, 0, 7); g.fill();
    g.strokeStyle = 'rgba(0,0,0,.6)'; g.lineWidth = 1; g.stroke();
    g.textAlign = ex < 34 ? 'left' : ex > w - 34 ? 'right' : 'center';
    g.fillStyle = '#9a6a5c'; g.fillText(e.n, ex, ey < 16 ? ey + 13 : ey - 6);
  }
  // 玄関と寝ている場所。この2点の関係がこのゲームの肝なので必ず見せる
  const dot = (x, y, col, rr) => {
    g.fillStyle = col; g.beginPath(); g.arc(X(x), Y(y), rr, 0, 7); g.fill();
    g.strokeStyle = 'rgba(255,255,255,.8)'; g.lineWidth = 1.2; g.stroke();
  };
  dot(plan.entry[0], plan.entry[1], '#ff5a62', 4.2);
  dot(plan.resident[0], plan.resident[1], '#8a9a6a', 4.2);
  return c;
}
/* カードに出す出口の要約 */
function exitSummary(plan) {
  const cnt = {};
  for (const e of plan.EXITS) cnt[e.n] = (cnt[e.n] || 0) + 1;
  const parts = Object.entries(cnt).map(([n, k]) => k > 1 ? `${n}×${k}` : n);
  return '出口: 玄関' + (parts.length ? '・' + parts.join('・') : 'のみ');
}

function renderCards() {
  const g = GROUPS[qi];
  const box = document.getElementById('cards');
  box.innerHTML = '';
  g.forEach(plan => {
    const el = document.createElement('div');
    el.className = 'card';
    // 物件名や価格は出さない。案A/B/C と、間取りの種別・広さ・階、特徴、出口だけ
    plan.label = '案' + 'ABC'[g.indexOf(plan)];
    const fl = (plan.addr.match(/(\d+階(?:\s*角部屋)?)/) || [, ''])[1];
    el.innerHTML = `<div class="txt"><b>${plan.label}</b><i>${plan.kind}・${plan.area}㎡${fl ? '・' + fl : ''}</i>` +
                   `<i class="tr">${plan.shape}</i><i class="ex">${exitSummary(plan)}</i>` +
                   `<div class="pick">この間取りで暮らす</div></div>`;
    el.prepend(planThumb(plan));
    el.addEventListener('click', ev => {
      if (revealing) return;
      // 選択中のカードの決定バーを押したら確定
      if (ev.target.classList.contains('pick') && picked === plan) { submit(); return; }
      picked = plan;
      [...box.children].forEach(c => c.classList.toggle('sel', c === el));
      showPlan(plan, true);
    });
    box.appendChild(el);
  });
  document.getElementById('qtitle').textContent = QUIZ[qi].q;
  document.querySelector('.qhead em').textContent = `QUIZ TIME ${qi + 1} / ${GROUPS.length}  ·  ${QUIZ[qi].theme}`;
  document.body.classList.add('quizzing');
  const dots = document.getElementById('qdots');
  dots.innerHTML = GROUPS.map((_, i) =>
    `<i class="${i < qi ? 'ok' : i === qi ? 'on' : ''}"></i>`).join('');
  document.getElementById('qhead').classList.add('on');
  box.classList.add('on');
  // 何も選ばれていないのに3Dが出ていると対応が分からない。最初の1件を選んだ状態から始める
  box.children[0].click();
}

/* 間取りを差し替えて見せる。quick なら演出済みの状態から始める */
function showPlan(plan, quick) {
  stopStage();
  buildPlan(plan);
  t0 = performance.now() - (quick ? 11.2 : 0) * 1000;
  frozen = null;
  quizCam = true;                 // 間取り全体が見える俯瞰に切り替える
  orbit = 0; spin = 0;            // 冒頭で回して見ていても、クイズは図面と同じ向きで見せる
}

const el = id => document.getElementById(id);
/* 何が決め手だったかを言い切る。これが無いと「後出し」に感じる */
function decider(r) {
  const sec = r.tIn.toFixed(0);
  if (r.escaped) {
    const dest = r.escKind === 'door' ? '玄関から外へ出た' : r.escKind === 'partition' ? '隔て板を蹴破って隣の家へ転がり込んだ'
               : r.escKind === 'hatch' ? '避難ハッチで下の階へ降りた' : r.escKind === 'fence' ? 'フェンスを越えた' : `${r.escVia}から外へ出た`;
    return [r.escVia, `${sec}秒で${dest}。侵入者は${Math.max(1, r.margin).toFixed(0)}秒後ろ。`];
  }
  if (r.giveup) return ['死角', `${sec}秒。全部の部屋を回っても見つけられず、帰った。`];
  if (r.locked && r.broke) return ['鍵の先に出口がない', `${sec}秒。鍵で3秒稼いだけど、扉を壊されて捕まった。`];
  if (r.seen0) return ['玄関から見えていた', `玄関に立った時点で、寝ているあなたが見えていた。`];
  if (r.tSeen < 4.5) return ['すぐ見つかった', `${r.tSeen.toFixed(0)}秒で見つかって、${sec}秒で捕まった。`];
  if (r.lastExit && r.wasExiting) return ['出口に時間がかかる', `${EXIT[r.lastExit.k].verb}途中で、背中を掴まれた。`];
  return ['寝室が近い', `${sec}秒。出口に着く前に捕まった。`];
}
function facts(r) {
  const [name] = decider(r);
  const chip = (ok, txt) => `<span class="${ok ? 'cool' : 'hot'}">${txt}</span>`;
  const seen = r.tSeen === Infinity ? '最後まで見つからず' : `${r.tSeen.toFixed(0)}秒で見つかった`;
  const doors = r.locked ? `鍵で3秒稼いだ` : r.broke ? `扉を${r.broke}枚壊された` : `扉${r.opened}枚を開けられた`;
  const exit = r.escaped ? `${r.escVia}から脱出` : r.lastExit && r.wasExiting ? `${r.lastExit.n}を使う途中で` : r.lastExit ? `${r.lastExit.n}へ向かう途中で` : '逃げ道なし';
  return `<span style="border-color:rgba(196,141,126,.55);color:#c48d7e">決め手: ${name}</span>` +
    chip(r.tSeen === Infinity || r.tSeen > 4.5, seen) +
    chip(r.locked || r.opened + r.broke >= 2, doors) +
    chip(r.escaped, exit) +
    (r.escaped ? `<span>余裕 ${Math.max(1, r.margin).toFixed(0)}秒</span>` : `<span>${r.tIn.toFixed(0)}秒</span>`);
}

/* 演出を流して、終わったら結果を出す */
function playAndJudge(plan, after) {
  revealing = true;
  document.body.classList.add('staging');
  el('cards').classList.remove('on');
  el('qgo').classList.remove('on');
  el('vbox').classList.remove('on');
  showPlan(plan, true);
  // 真上から見せる。扇が壁で切られる様子は俯瞰でないと分からない
  setTimeout(() => {
    const r = startStage(plan);
    ST.onEnd = () => { after(r); };
  }, 420);
}

function showVerdict(plan, r, opts) {
  document.body.classList.remove('staging');
  el('tick').classList.remove('on');
  document.body.classList.add('verdicting');
  const best = (GROUPS[plan.q - 1] || []).find(p => p.safe) || plan;
  const isBest = plan.safe;
  el('vmark').textContent = r.caught ? '✕' : isBest ? '✓' : '△';
  el('vmark').className = 'mark ' + (r.caught ? 'ng' : isBest ? 'ok' : 'mid');
  el('vtitle').innerHTML = `${plan.label || plan.name}<span class="tr">${plan.shape}</span>` +
    (r.caught ? '<span style="color:#d0525a">残念。追いつかれた</span>'
     : isBest ? '<span style="color:#4f8a5c">正解。侵入は失敗した</span>'
     : r.giveup ? '<span style="color:#c48d7e">侵入者は諦めた。でも、いちばん安全な案ではない</span>'
     : `<span style="color:#c48d7e">惜しい。逃げ切れたけど余裕は${Math.max(1, r.margin).toFixed(0)}秒。いちばん安全な案は${Math.max(1, best.margin).toFixed(0)}秒</span>`);
  el('vwhy').innerHTML = plan.why + `<br><span style="color:#7f8a6b">${decider(r)[1]}</span>` +
    (isBest ? '' : `<br><span style="color:#c48d7e">いちばん安全だったのは${best.label || best.name}。${best.shape}。余裕${Math.max(1, best.margin).toFixed(0)}秒。</span>`);
  el('vfacts').innerHTML = facts(r);
  const b = el('vbtns');
  b.innerHTML = '';
  for (const [label, main, fn] of opts) {
    const btn = document.createElement('button');
    btn.className = 'vbtn' + (main ? ' main' : '');
    btn.textContent = label;
    btn.addEventListener('click', fn);
    b.appendChild(btn);
  }
  el('vbox').classList.add('on');
}

function submit() {
  if (!picked || revealing) return;
  const chosen = picked;
  const answer = GROUPS[qi].find(p => p.safe);
  playAndJudge(chosen, r => {
    const right = chosen.safe;
    if (right) score++;
    results.push({ q: qi, theme: QUIZ[qi].theme, right, pick: chosen.label });
    const next = () => { el('vbox').classList.remove('on');
      document.body.classList.remove('verdicting'); nextQuestion(); };
    // 演出は選んだ案だけ。正解でも不正解でも、そのまま次の問題へ
    showVerdict(chosen, r, [[qi + 1 < GROUPS.length ? '次の問題へ' : '採点を見る', true, next]]);
  });
}

function nextQuestion() {
  revealing = false;
  qi++;
  if (qi >= GROUPS.length) { finish(); return; }
  picked = null;
  stopStage();
  showPlan(GROUPS[qi][0], true);
  renderCards();
}

function finish() {
  window.__count && window.__count('estate-finish');
  stopStage();                     // 終わったら演出の扇や小人を片付ける
  document.body.classList.remove('staging', 'verdicting');
  el('qhead').classList.remove('on');
  el('cards').classList.remove('on');
  const n = GROUPS.length, wrong = n - score;
  const rank = RANK.find(r => score >= r.s) || RANK[RANK.length - 1];
  el('vmark').textContent = `${score}/${n}`;
  el('vmark').className = 'mark ' + (score >= 4 ? 'ok' : score >= 2 ? 'mid' : 'ng');
  el('vtitle').innerHTML = `正解 ${score}・不正解 ${wrong}<br><span style="color:${score >= 4 ? '#7be8a4' : score >= 2 ? '#f0cf7e' : '#ff6b73'}">${rank.title}</span>`;
  el('vwhy').innerHTML = rank.text + '<br><span style="color:#7f8a6b">玄関から寝床までの距離、建具と鍵、出口の種類。図面を見れば全部わかる。世界一安全な家は、ここから始まる。</span>';
  el('vfacts').innerHTML = results.map(x =>
    `<span class="${x.right ? 'cool' : 'hot'}">第${x.q + 1}問 ${x.theme} ${x.right ? '○' : '×'}</span>`).join('');
  const b = el('vbtns'); b.innerHTML = '';
  const again = document.createElement('button');
  again.className = 'vbtn main'; again.textContent = 'もう一度';
  again.addEventListener('click', () => {
    // 2周目は冒頭の製図アニメを飛ばす。毎回15秒待たされると冗長
    qi = 0; score = 0; picked = null; revealing = false; results = [];
    el('vbox').classList.remove('on');
    showPlan(GROUPS[0][0], true); renderCards();
  });
  const home = document.createElement('button');
  home.className = 'vbtn'; home.textContent = 'ホームへ戻る';
  home.addEventListener('click', () => { location.href = '../index.html'; });
  b.appendChild(again); b.appendChild(home);
  el('vbox').classList.add('on');
}

el('qgo').addEventListener('click', submit);
// 冒頭は製図からの演出を最後まで見せ、導入パネルのボタンでクイズを始める
function startQuiz() {
  if (document.body.classList.contains('quizzing')) return;
  introDone = true;
  el('intro').classList.remove('on');
  quizCam = true; renderCards();
}
el('qstart').addEventListener('click', startQuiz);

window.__estate = { T, KEY, camera, cityMeshes, renderer, scene, moon,
  // 物件を差し替えると配列ごと入れ替わるので、参照ではなくゲッタで公開する
  get walls(){ return walls; }, get furn(){ return furn; }, get labels(){ return labels; },
  get t(){ return frozen != null ? frozen : (performance.now() - t0) / 1000; },
  PLANS, DEFS, buildPlan, get PLAN(){ return PLAN; }, P, simulate, visPoly, canSee, SIM, validate, findPath,
  startStage, stopStage, get ST(){ return ST; }, figIn, figOut,
  showPlan, submit, renderCards, GROUPS, get qi(){ return qi; }, get score(){ return score; },
  set quizCam(v){ quizCam = v; }, fitQuizCam,
  pick: p => { picked = p; },
  startQuiz,
  goto: q => { qi = q - 1; picked = null; revealing = false; results = []; introDone = true; el('intro').classList.remove('on'); stopStage(); el('vbox').classList.remove('on');
    document.body.classList.remove('verdicting', 'staging'); showPlan(GROUPS[qi][0], true); renderCards(); },
  seek: s => { t0 = performance.now() - s * 1000; frozen = null; },
  freeze: s => { frozen = s; }, run: () => { frozen = null; } };
</script>
</body>
</html>
